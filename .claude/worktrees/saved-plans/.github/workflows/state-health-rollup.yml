name: State-health weekly rollup

# Weekly classified rollup of scraper-health drift, posted as a single
# GitHub issue. Invokes the state-health-triage agent (lives at
# .claude/agents/state-health-triage.md) via the Anthropic API directly,
# so it runs entirely on GitHub-hosted runners — no local machine, no
# Claude Code session required.
#
# Triggers:
#   - Sunday 21:00 UTC (17:00 EDT / 16:00 EST) — after the Sunday 07:00
#     UTC prereqs cron has fired and pushed its history records, so the
#     rollup sees a full week of fresh data.
#   - workflow_dispatch — manual invocation for testing
#
# Required secret: ANTHROPIC_API_KEY (set in repo settings)
# Permissions: contents:read (history.jsonl + registry); issues:write

on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without posting issue (logs the markdown body only)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  rollup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Generate and post rollup
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx tsx scripts/lib/state-health-rollup.ts --dry-run
          else
            npx tsx scripts/lib/state-health-rollup.ts
          fi
