<style>
:root{
  --bg:#0f1115; --panel:#181b22; --panel2:#1f242e; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2a2f3a; --line2:#3a4150;
  /* seat availability family */
  --seat-open:#22c55e; --seat-fill:#f59e0b; --seat-full:#ef4444; --seat-none:#6b7280;
  /* transfer family — deliberately DIFFERENT hues + always paired with an icon */
  --tx-direct:#6366f1; --tx-elective:#64748b; --tx-none:#ef4444;
  /* college palette for schedule */
  --col1:#2dd4bf; --col2:#a78bfa; --col3:#f472b6; --col4:#facc15;
  --accent:#2dd4bf;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
.topbar{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 20px}
.brand{font-size:13px;color:var(--muted);letter-spacing:.02em}
.brand b{color:var(--ink)}
.crumbs{font-size:12px;color:var(--muted);margin-top:4px}
.crumbs b{color:var(--accent)}
.stepper{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.step{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;gap:9px;align-items:center;transition:.15s}
.step:hover{border-color:var(--line2)}
.step.active{border-color:var(--accent);background:#10231f}
.step .num{width:22px;height:22px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.step.active .num{background:var(--accent);color:#06231e}
.step .lbl{font-size:13px;font-weight:600}
.step .hint{font-size:11px;color:var(--muted);font-weight:400}
.wrap{max-width:1040px;margin:0 auto;padding:20px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;max-width:760px;margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:10px 0}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.btn{background:var(--accent);color:#06231e;border:none;border-radius:9px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.foot-note{color:var(--muted);font-size:11.5px;font-style:italic;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
select{background:var(--panel2);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:13px}
.empty{background:var(--panel2);border:1px dashed var(--line2);border-radius:10px;padding:16px;color:var(--muted);font-size:12.5px;text-align:center}
.empty b{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--muted)}
/* glossary */
.gloss{border-bottom:1px dotted var(--accent);cursor:help}
.gloss sup{font-size:.7em;color:var(--accent);font-weight:700;margin-left:1px}
/* utility actions in topbar */
.util{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.util button{background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.util button:hover{border-color:var(--accent)}
.util .ok{color:#34d399}
/* landing */
.hero-wrap{text-align:center;padding:18px 0 6px}
.hero-wrap h1{font-size:26px;margin:0 0 6px}
.hero-wrap .sub{margin:0 auto 18px;font-size:15px}
.onramps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.onramp{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:left;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px}
.onramp:hover{border-color:var(--accent);transform:translateY(-2px)}
.onramp .ic{font-size:24px}
.onramp h3{margin:2px 0 0;font-size:15px}
.onramp p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.4}
.onramp .go{margin-top:auto;color:var(--accent);font-size:12.5px;font-weight:700;padding-top:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip-btn{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:20px;padding:7px 13px;font-size:12.5px;cursor:pointer}
.chip-btn:hover{border-color:var(--accent)}
/* next-semester hero card */
.nextsem{background:linear-gradient(135deg,#10231f,#13283a);border:1px solid var(--accent);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.nextsem h2{margin:0 0 2px;font-size:17px}
.nextsem .pickrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.06);font-size:13px}
.nextsem .pickrow:first-of-type{border-top:none}
.nextsem .tx-ic{font-weight:800;width:16px;text-align:center}
.nextsem .meta{color:var(--muted);font-size:11.5px}
.econ{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
.econ .stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 13px;min-width:120px}
.econ .stat b{display:block;font-size:18px;color:var(--ink)}
.econ .stat span{font-size:11px;color:var(--muted)}
/* nudge */
.nudge{background:#211a10;border:1px solid #b4530955;border-left:3px solid #f59e0b;border-radius:10px;padding:10px 13px;margin-bottom:12px;font-size:12.5px;color:#fcd9a8}
.nudge b{color:#fbbf24}
.inv-badge{display:none;position:fixed;bottom:14px;right:14px;z-index:50;background:#3b1417;border:1px solid #ef4444;color:#fecaca;border-radius:10px;padding:9px 13px;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px -8px rgba(0,0,0,.6)}
/* ---- DAG ---- */
.dag-wrap{overflow-x:auto}
svg.dag{display:block}
.laneLabel{fill:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.edge{stroke:var(--line2);stroke-width:1.8;fill:none}
.edge.or{stroke-dasharray:4 3}
.node{cursor:pointer}
.node rect{rx:9;ry:9;stroke-width:2}
.node .code{font-weight:700;font-size:12.5px;fill:#0b0d11}
.node .ttl{font-size:9.5px;fill:#0b0d11;opacity:.72}
.node .seat{font-size:9.5px;font-weight:700;fill:#0b0d11;opacity:.85}
.n-open rect{fill:#bbf7d0;stroke:#16a34a}
.n-fill rect{fill:#fde68a;stroke:#d97706}
.n-full rect{fill:#fecaca;stroke:#dc2626}
.n-none rect{fill:#262b35;stroke:#4b5563}
.n-none .code,.n-none .ttl,.n-none .seat{fill:#cbd2de}
.node.incart rect{stroke:var(--accent);stroke-width:3.5}
.node .cart-badge{fill:var(--accent);font-size:11px;font-weight:800}
.node .rel-or{fill:#7c3aed;font-size:9px;font-weight:800}
.node .rel-cx{fill:#b45309;font-size:9px;font-weight:800}
.edge.complex{stroke-dasharray:1 4;stroke:#a16207}
.edge.oredge{stroke-dasharray:5 4;stroke:#8b5cf6}
/* completion + lens states */
.node.done rect{fill:#1c2230;stroke:#3f4654}
.node.done .code{fill:#7e8a9c;text-decoration:line-through}
.node.done .ttl,.node.done .seat{fill:#5a6474}
.node.eligible rect{stroke:#eab308;stroke-width:3}
.node.deemph{opacity:.32}
.node .done-toggle{fill:#0f1115;stroke:#5b6473;stroke-width:1.5;cursor:pointer}
.node.done .done-toggle{fill:#22c55e;stroke:#22c55e}
.node .done-check{font-size:11px;font-weight:800;fill:#06231e;pointer-events:none}
.node .tx-badge{font-size:11px;font-weight:800}
.node .ext-need{font-size:8.5px;font-weight:700;fill:#b45309}
.ctrlbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:4px 0 12px;font-size:12.5px}
.ctrlbar label{display:inline-flex;gap:6px;align-items:center;cursor:pointer;color:#cbd2de}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:var(--muted);border:none;padding:6px 11px;font-size:12px;cursor:pointer}
.seg button.on{background:var(--accent);color:#06231e;font-weight:700}
.dag-mobile{display:none}
.dag-mobile .sem{margin:8px 0}
.dag-mobile .sem h4{margin:0 0 5px;font-size:12px;color:var(--muted);font-weight:700}
/* sankey ribbons */
.ribbon{opacity:.55} .ribbon:hover{opacity:.85}
.rib-direct{fill:var(--tx-direct)} .rib-elective{fill:var(--tx-elective)} .rib-none{fill:var(--tx-none)} .rib-nodata{fill:#475569}
.snode{font-size:11px;fill:var(--ink);paint-order:stroke;stroke:#181b22;stroke-width:3px;stroke-linejoin:round}
.snode-sub{font-size:9.5px;fill:var(--muted)}
/* ---- schedule grid ---- */
.cart-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cart-chip{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12px;display:inline-flex;gap:8px;align-items:center}
.cart-chip .x{cursor:pointer;color:var(--muted);font-weight:700}
table.grid{border-collapse:collapse;width:100%;min-width:640px}
table.grid th{font-size:11px;color:var(--muted);font-weight:600;padding:6px 0}
table.grid td{border:1px solid var(--line);height:24px;position:relative;padding:0}
table.grid td.time{border:none;color:var(--muted);font-size:10.5px;text-align:right;padding-right:8px;width:54px;vertical-align:top}
table.grid tbody tr:nth-child(odd) td:not(.time){background:rgba(255,255,255,.018)}
:root[data-theme="light"] table.grid tbody tr:nth-child(odd) td:not(.time){background:rgba(0,0,0,.025)}
.comparator-summary{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.comparator-summary b{color:var(--ink)}
.disco-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:680px){.disco-grid{grid-template-columns:1fr}}
.sec{position:absolute;left:2px;right:2px;border-radius:5px;padding:2px 5px;font-size:10px;line-height:1.2;color:#0b0d11;font-weight:600;overflow:hidden}
.sec small{display:block;font-weight:400;opacity:.8;font-size:9px}
.sec.col1{background:var(--col1)} .sec.col2{background:var(--col2)} .sec.col3{background:var(--col3)} .sec.col4{background:var(--col4)}
.sec.dim{opacity:.3;filter:grayscale(.6)}
.sec.pick{outline:2px solid #34d399;outline-offset:-1px;box-shadow:0 0 0 2px rgba(52,211,153,.3)}
.sec.work{background:repeating-linear-gradient(45deg,#374151,#374151 6px,#404a5a 6px,#404a5a 12px);color:#cbd2de;border:1px dashed #5b6473}
.grid-mobile{display:none}
/* ---- sankey ---- */
.sankey-wrap{overflow-x:auto}
.tx-head{font-size:13px;margin:0 0 10px}
.tx-head b{color:var(--accent)}
svg.sankey{display:block;min-width:680px}
.colHdr{fill:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.lk{fill:none;opacity:.4}.lk:hover{opacity:.85}
.lk.direct{stroke:var(--tx-direct)} .lk.elective{stroke:var(--tx-elective)} .lk.none{stroke:var(--tx-none)}
.txnode{font-size:11px;fill:var(--ink)}
.txicon{font-size:12px;font-weight:800}
/* ---- outcomes ---- */
.oc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.range-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12px}
.range-row .nm{width:60px;color:var(--muted)}
.track{position:relative;flex:1;height:20px;background:#11151d;border-radius:6px}
.range{position:absolute;height:8px;top:6px;background:linear-gradient(90deg,#2dd4bf66,#2dd4bf);border-radius:4px}
.med{position:absolute;top:1px;width:3px;height:18px;background:#fff;border-radius:2px}
.bars{display:flex;align-items:flex-end;gap:14px;height:150px;border-bottom:1px solid var(--line);padding:0 2px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar{width:62%;border-radius:6px 6px 0 0;position:relative;min-height:2px}
.bar b{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10.5px;white-space:nowrap}
.bar.pos{background:linear-gradient(180deg,#34d399,#059669)}
.bar.neg{background:linear-gradient(180deg,#60a5fa,#2563eb)}
.blab{color:var(--muted);font-size:10.5px;margin-top:6px;text-align:center;line-height:1.2}
.hl-band{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
@media(max-width:680px){
  .oc-grid{grid-template-columns:1fr}
  .grid-desktop{display:none}
  .grid-mobile{display:block}
  .dag-wrap{display:none}
  .dag-mobile{display:block}
  .onramps{grid-template-columns:1fr}
  .wrap{padding:14px}
}
/* ---------- Tier 3: warmth, motion, light mode, a11y, print ---------- */
body{background:radial-gradient(1200px 600px at 50% -200px,#15202b 0%,var(--bg) 60%) fixed}
.card{box-shadow:0 1px 0 rgba(255,255,255,.02),0 8px 24px -16px rgba(0,0,0,.6)}
.btn{transition:transform .12s ease, filter .12s ease}
.btn:not(:disabled):hover{filter:brightness(1.08);transform:translateY(-1px)}
.node rect{transition:stroke .15s ease, filter .15s ease}
.node:hover rect{filter:brightness(1.05)}
.node.eligible rect{animation:elig-in .4s ease}
@keyframes elig-in{from{stroke-opacity:.2}to{stroke-opacity:1}}
.celebrate{display:inline-block;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
:where(a,button,select,.step,.node,.onramp,.chip-btn,.gloss):focus-visible{outline:3px solid #38bdf8;outline-offset:2px;border-radius:6px}
/* light mode */
:root[data-theme="light"]{
  --bg:#f6f8fb; --panel:#ffffff; --panel2:#eef2f7; --ink:#16202b; --muted:#5a6573; --line:#e2e8f0; --line2:#cbd5e1;
  --tx-elective:#475569; --accent:#0d9488;
}
:root[data-theme="light"] body{background:radial-gradient(1200px 600px at 50% -200px,#e9f2f1 0%,var(--bg) 60%) fixed}
:root[data-theme="light"] .topbar{background:rgba(246,248,251,.92)}
:root[data-theme="light"] .step.active{background:#dcfbf4}
:root[data-theme="light"] .nextsem{background:linear-gradient(135deg,#e7f7f3,#e8f0fb)}
:root[data-theme="light"] .snode{stroke:#ffffff}
:root[data-theme="light"] .n-none rect{fill:#e5e9f0;stroke:#94a3b8}
:root[data-theme="light"] .n-none .code,:root[data-theme="light"] .n-none .ttl,:root[data-theme="light"] .n-none .seat{fill:#475569}
:root[data-theme="light"] .nudge{background:#fef6e7;color:#7c4a03}
:root[data-theme="light"] .empty{background:#eef2f7}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  .topbar,.util,.row-actions,.ctrlbar,#actHelp{display:none!important}
  body{background:#fff;color:#000} .card{box-shadow:none;border-color:#ccc;break-inside:avoid}
  .dag-wrap{display:block!important} .dag-mobile{display:none!important}
}
</style>
<div class="topbar">
  <div class="brand"><b>Community College Path</b> — prototype · Plan-to-Outcome journey</div>
  <div class="crumbs" id="crumbs"></div>
  <div class="stepper" id="stepper"></div>
  <div class="util" id="util"></div>
</div>
<div class="wrap" id="view"></div>

<script>
(function(){
const D=window.DATA;
const UNIVS=Object.keys(D.transfersByUniv);
// Term selector is limited to the terms the HOME college actually has, so seat
// colors (home-college, term-keyed) and the schedule stay consistent. Other
// colleges' sections only appear for terms they share.
const TERMS=(D.homeTerms&&D.homeTerms.length)?D.homeTerms.slice():[...new Set(Object.values(D.sections).flat().map(s=>s.term))].sort();
const TERM_LABEL=t=>({SP:"Spring",SU:"Summer",FA:"Fall",WI:"Winter"}[t.slice(4)]||t.slice(4))+" "+t.slice(0,4);

// ---------- state (persisted in URL hash) ----------
const DONE_KEY="ccp-done-"+D.college+"-"+(D.program.slug||D.program.title);
function loadDone(){try{return JSON.parse(localStorage.getItem(DONE_KEY))||[]}catch{return[]}}
function saveDone(){try{localStorage.setItem(DONE_KEY,JSON.stringify(S.completed))}catch{}}
const S={step:1, term:TERMS[0], univ:UNIVS[0], cart:[], started:false,
  completed:loadDone(), planMode:"cart" /* cart | done */, eligibleOnly:false, txLens:false};
function loadURL(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("step"))S.step=+h.get("step");
  if(h.get("term")&&TERMS.includes(h.get("term")))S.term=h.get("term");
  if(h.get("univ")&&UNIVS.includes(h.get("univ")))S.univ=h.get("univ");
  if(h.get("cart"))S.cart=h.get("cart").split(",").filter(Boolean);
  if(h.get("tx"))S.txLens=h.get("tx")==="1";
  // a shared/deep link (anything beyond a bare load) skips the welcome screen
  if(h.get("step")||h.get("cart")||h.get("start")==="1")S.started=true;
}
// Best transfer verdict for a course to the currently-selected university.
function txVerdict(code){
  const all=D.transfersByUniv[S.univ]||[];
  const ms=all.filter(x=>x.cc===code);
  if(!ms.length)return"nodata";
  const rank={direct:3,elective:2,none:1};
  return ms.map(t=>t.noCredit?"none":t.elective?"elective":"direct").sort((a,b)=>rank[b]-rank[a])[0];
}
function saveURL(){
  const h=new URLSearchParams();
  // On the welcome screen, keep the URL bare so a reload returns to the welcome screen
  // (writing step/cart here is what made refresh silently skip the landing).
  if(!S.started){ history.replaceState(null,"",location.pathname+location.search); return; }
  h.set("start","1");
  h.set("step",S.step); h.set("term",S.term); h.set("univ",S.univ);
  if(S.cart.length)h.set("cart",S.cart.join(","));
  if(S.txLens)h.set("tx","1");
  history.replaceState(null,"","#"+h.toString());
}

// ---------- helpers ----------
const STEPS=[
  {n:1,lbl:"Plan",hint:"what & when"},
  {n:2,lbl:"Schedule",hint:"can I get a seat?"},
  {n:3,lbl:"Transfer",hint:"will it count?"},
  {n:4,lbl:"Outcomes",hint:"what after?"},
];
function seatAgg(code){return (D.seatAggByTerm[S.term]||{})[code];}
function seatClass(code){
  const a=seatAgg(code);
  if(!a)return"none";
  if(a.open===0)return"full";
  if(a.open/a.total<0.25)return"fill";
  return"open";
}
function allCourses(){
  const out=[], seen=new Set();
  for(const g of D.program.groups)for(const c of g.courses){
    if(seen.has(c.code))continue;            // a course can satisfy two requirement groups — show it once
    seen.add(c.code); out.push(c);
  }
  return out;
}
// External (out-of-program) prerequisites we can't track here — gen-ed / placement / dev-ed.
// Summarised by subject so we surface "also needs ENGL" instead of silently overstating readiness.
function extPrereqSummary(code, progSet){
  const all=(D.prereqs[code]?.courses)||[];
  const ext=all.filter(x=>!progSet.has(x));
  if(!ext.length)return null;
  const subjects=[...new Set(ext.map(x=>(x.match(/^[A-Za-z]+/)||[x])[0].toUpperCase()))].slice(0,2);
  return subjects.join("/");
}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");}
// ---------- invariant harness (app-wide, not just schedule) ----------
// Each view asserts its own "render can represent everything it computed." Violations are
// collected, logged to console, and surfaced as a small QA badge — never silently dropped.
const INV=[];
function inv(cond,msg){ if(!cond)INV.push(msg); }
function flushInv(){
  let b=document.getElementById("invBadge");
  if(INV.length){
    console.warn("[invariant] "+INV.length+" issue(s) this render:",INV.slice());
    if(!b){b=document.createElement("div");b.id="invBadge";b.className="inv-badge";b.title="Click to dismiss";b.onclick=()=>{b.style.display="none";};document.body.appendChild(b);}
    b.textContent="⚠ "+INV.length+" invariant issue"+(INV.length>1?"s":"")+" — see console";
    b.style.display="block";
  } else if(b){ b.style.display="none"; }
  INV.length=0;
}
// Derive AND vs OR among a course's IN-PROGRAM prerequisites from the real prereq text.
// Honest by design: only claims AND/OR when the connectors between the actual course
// tokens are unambiguous; otherwise returns 'complex' (shown neutrally, with the raw
// text on hover) rather than guessing.
function prereqRelation(code, progSet){
  const pr=D.prereqs[code]; if(!pr) return {type:'none', courses:[]};
  const inp=(pr.courses||[]).filter(x=>progSet.has(x));
  if(inp.length===0) return {type:'none', courses:[]};
  if(inp.length===1) return {type:'single', courses:inp, text:pr.text||""};
  const text=pr.text||"";
  // locate each code on a digit boundary so "ACCT 1100" doesn't match inside "ACCT 11000"
  const idx=inp.map(c=>{const re=new RegExp(c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![0-9])");const m=re.exec(text);return {c,i:m?m.index:-1};}).filter(o=>o.i>=0).sort((a,b)=>a.i-b.i);
  if(idx.length<2) return {type:'complex', courses:inp, text}; // canonical codes not literally in text
  let ands=0, ors=0;
  for(let k=0;k<idx.length-1;k++){
    const seg=text.slice(idx[k].i, idx[k+1].i).toLowerCase();
    const m=seg.match(/\b(and|or)\b/g);
    if(m){ (m[m.length-1]==='and') ? ands++ : ors++; }
  }
  if(ands>0 && ors===0) return {type:'and', courses:inp, text};
  if(ors>0 && ands===0) return {type:'or', courses:inp, text};
  return {type:'complex', courses:inp, text}; // mixed/none → don't fabricate a choice
}

// ---------- shared model (computed once; used by Plan, the assembler, the landing) ----------
const COLLEGE_ORDER=["atlanta-tech","gwinnett-tech","chattahoochee-tech","albany-tech"];
const COLLEGE_NAME={"atlanta-tech":"Atlanta Tech","gwinnett-tech":"Gwinnett Tech","chattahoochee-tech":"Chattahoochee Tech","albany-tech":"Albany Tech"};
function parseTime(t){if(!t)return null;const m=t.match(/(\d+):(\d+)\s*(AM|PM)/i);if(!m)return null;let h=+m[1]%12;if(/PM/i.test(m[3]))h+=12;return h*60+ +m[2];}
function dayList(d){if(!d)return[];const map={Su:0,Mo:1,Tu:2,We:3,Th:4,Fr:5,Sa:6};const out=[];
  let s=String(d).replace(/Sun/gi,"Su").replace(/Mon/gi,"Mo").replace(/Tue?s?/gi,"Tu").replace(/Wed/gi,"We").replace(/Thu?r?s?/gi,"Th").replace(/Fri/gi,"Fr").replace(/Sat/gi,"Sa");
  (s.match(/Su|Mo|Tu|We|Th|Fr|Sa|M|W|F/g)||[]).forEach(x=>{const k={M:"Mo",W:"We",F:"Fr"}[x]||x;if(map[k]!=null)out.push(map[k]);});
  return [...new Set(out)];}
const WORK=[{d:[1,3,5],s:15*60,e:19*60,label:"Work shift"}]; // Mon/Wed/Fri 3–7pm (illustrative)
function overlaps(a,b){const common=a.dl.filter(d=>b.dl.includes(d));return common.length&&a.st<b.en&&b.st<a.en;}
function hitsWork(sec){return WORK.some(w=>w.d.some(d=>sec.dl.includes(d))&&sec.st<w.e&&sec.en>w.s);}
// gather a course list's sections for a term, split timed (grid) vs anytime (async/online/placeholder)
function gather(codes,term){const secs=[],anytime=[];
  codes.forEach(code=>{(D.sections[code]||[]).filter(s=>s.term===term).forEach(s=>{
    const st=parseTime(s.start),en=parseTime(s.end),dl=dayList(s.days);
    const ci=COLLEGE_ORDER.indexOf(s.college),colIdx=ci>=0?ci:0;
    const dur=(en!=null?en:st+75)-st;
    const fullDay=st!=null&&st<=1&&en!=null&&en>=23*60+58;
    const timed=s.days&&s.start&&st!=null&&dl.length&&!fullDay&&dur>0&&dur<=6*60;
    if(timed)secs.push({code,...s,dl,st,en:en||st+75,colIdx}); else anytime.push({code,...s,colIdx});
  });}); return {secs,anytime};}

const PROG=allCourses();
const PROGSET=new Set(PROG.map(c=>c.code));
const DEPS={}; PROG.forEach(c=>DEPS[c.code]=(D.prereqs[c.code]?.courses||[]).filter(x=>PROGSET.has(x)));
const REL={}; PROG.forEach(c=>REL[c.code]=prereqRelation(c.code,PROGSET));
const cr=code=>D.credits[code]||3;
const doneSet=()=>new Set(S.completed);
function prereqsMet(code,done){const d=DEPS[code]; if(!d.length)return true; return REL[code].type==='or'?d.some(x=>done.has(x)):d.every(x=>done.has(x));}
function isEligible(code,done){done=done||doneSet(); return !done.has(code)&&seatClass(code)!=="none"&&prereqsMet(code,done);}

// (#7) "Your next semester" — pick the best registrable set: eligible + offered + fits work,
// conflict-free, ~15 cr cap, prioritising courses that transfer directly to the chosen university.
function nextSemester(){
  const done=doneSet();
  const cands=PROG.filter(c=>isEligible(c.code,done));
  const {secs,anytime}=gather(cands.map(c=>c.code),S.term);
  const byCourse={};
  secs.forEach(s=>{if(s.open!==0&&!hitsWork(s))(byCourse[s.code]=byCourse[s.code]||[]).push(s);});
  anytime.forEach(s=>{if(s.open!==0)(byCourse[s.code]=byCourse[s.code]||[]).push({...s,anytime:true});});
  const txRank={direct:0,elective:1,none:2,nodata:3};
  const order=cands.filter(c=>byCourse[c.code]&&byCourse[c.code].length)
    .sort((a,b)=>(txRank[txVerdict(a.code)]-txRank[txVerdict(b.code)])||(cr(b.code)-cr(a.code)));
  const CAP=15, chosen=[]; let credits=0;
  for(const c of order){ if(credits+cr(c.code)>CAP)continue;
    const opt=byCourse[c.code].find(o=>o.anytime||chosen.every(p=>p.sec.anytime||!overlaps(p.sec,o)));
    if(!opt)continue; chosen.push({course:c,sec:opt,tx:txVerdict(c.code)}); credits+=cr(c.code); }
  return {chosen, credits, eligibleTotal:cands.length};
}
// (#8) cost & time to finish — honest estimate from real tuition + remaining credits
function economics(){
  const done=doneSet();
  const totalCr=D.program.credits||PROG.reduce((a,c)=>a+cr(c.code),0);
  const doneCr=PROG.filter(c=>done.has(c.code)).reduce((a,c)=>a+cr(c.code),0);
  const remainCr=Math.max(0,totalCr-doneCr);
  const perCr=D.outcomes.tuition?Math.round(D.outcomes.tuition/30):null; // annual tuition ÷ ~30 cr/yr
  const tuitionCost=perCr!=null?remainCr*perCr:null;
  const lowIncomeNet=(D.outcomes.cost&&D.outcomes.cost.netPriceByIncome&&D.outcomes.cost.netPriceByIncome["0_30000"]);
  return {totalCr,doneCr,remainCr,perCr,tuitionCost,lowIncomeNet,
    termsPT:Math.ceil(remainCr/12), termsFT:Math.ceil(remainCr/15)};
}
// tiny glossary helper (#6 plain language) — wraps a term with a tap/hover definition
const GLOSS={
  prerequisite:"A class you must finish before you're allowed to take another one.",

  credential:"The award you earn — like a certificate or an associate degree (A.S./A.A.S.).",
  "net price":"What you actually pay after grants and scholarships — not the sticker price.",

  prereq:"A class you must finish before you're allowed to take another one.",
};

// ================= STEP 1: PLAN (DAG) =================
function plan(){
  // use the shared model (deps/rel/cr/eligibility) so Plan, the assembler and the landing never diverge
  const courses=PROG, inProg=PROGSET, deps=DEPS, rel=REL;
  const done=doneSet();
  const isEligible=code=>!done.has(code)&&seatClass(code)!=="none"&&prereqsMet(code,done);

  // ---- (#6) earliest term from prereqs, then CREDIT-AWARE packing (~16 cr/term) ----
  const level={}; let changed=true, guard=0; courses.forEach(c=>level[c.code]=0);
  while(changed&&guard++<30){changed=false;
    for(const c of courses){const d=deps[c.code]; if(!d.length)continue;
      const lv=d.map(x=>level[x]??0);
      const need=(rel[c.code].type==='or')?Math.min(...lv):Math.max(...lv);
      if(level[c.code]<need+1){level[c.code]=need+1;changed=true;}}}
  const CAP=16;
  const ordered=[...courses].sort((a,b)=>(level[a.code]-level[b.code])||(cr(b.code)-cr(a.code)));
  const sem={}, semLoad=[];
  for(const c of ordered){
    const d=deps[c.code];
    const minSem=d.length ? ((rel[c.code].type==='or'?Math.min(...d.map(x=>sem[x]??0)):Math.max(...d.map(x=>sem[x]??0)))+1) : 0;
    let s=minSem; while(true){ if(semLoad[s]==null)semLoad[s]=0; if(semLoad[s]+cr(c.code)<=CAP||semLoad[s]===0)break; s++; }
    sem[c.code]=s; semLoad[s]+=cr(c.code);
  }
  const maxL=Math.max(...Object.values(sem),0);
  const colsArr={}; for(let i=0;i<=maxL;i++)colsArr[i]=[]; courses.forEach(c=>colsArr[sem[c.code]].push(c));
  // ---- (#6) barycenter ordering within each column to reduce edge crossings ----
  const COLW=212, NODEW=182, NH=54, VGAP=12, PADT=40;
  const yIndex={}; Object.values(colsArr).forEach(col=>col.forEach((c,j)=>yIndex[c.code]=j));
  for(let pass=0;pass<3;pass++) for(let i=1;i<=maxL;i++){
    colsArr[i].sort((a,b)=>{const ba=bary(a.code),bb=bary(b.code);return ba-bb;});
    colsArr[i].forEach((c,j)=>yIndex[c.code]=j);
  }
  function bary(code){const d=deps[code]; if(!d.length)return yIndex[code]??0;
    const ys=d.map(x=>yIndex[x]).filter(v=>v!=null); return ys.length?ys.reduce((a,b)=>a+b,0)/ys.length:(yIndex[code]??0);}
  const colMax=Math.max(...Object.values(colsArr).map(a=>a.length),1);
  const H=PADT+colMax*(NH+VGAP)+10, W=Math.max(700,(maxL+1)*COLW+20);
  const pos={};
  for(let i=0;i<=maxL;i++)colsArr[i].forEach((c,j)=>pos[c.code]={x:10+i*COLW,y:PADT+j*(NH+VGAP)});

  // ---- edges (real AND/OR/complex styling) ----
  const edgeClass={and:'',or:'oredge',complex:'complex',single:'',none:''};
  let edges="";
  for(const c of courses)for(const d of deps[c.code]){const a=pos[d],b=pos[c.code]; if(!a||!b)continue;
    edges+=`<path class="edge ${edgeClass[rel[c.code].type]||''}" d="M${a.x+NODEW},${a.y+NH/2} C${a.x+NODEW+30},${a.y+NH/2} ${b.x-30},${b.y+NH/2} ${b.x},${b.y+NH/2}"/>`;}

  // ---- nodes ----
  const TX={direct:{ic:"✓",col:"var(--tx-direct)"},elective:{ic:"≈",col:"var(--tx-elective)"},none:{ic:"✕",col:"var(--tx-none)"},nodata:{ic:"?",col:"#64748b"}};
  let lanes="",nodes="";
  for(let i=0;i<=maxL;i++)lanes+=`<text class="laneLabel" x="${14+i*COLW}" y="24">Semester ${i+1} · ${semLoad[i]||0} cr</text>`;
  for(const c of courses){const code=c.code,p=pos[code],sc=seatClass(code),a=seatAgg(code);
    const isDone=done.has(code), elig=isEligible(code), incart=S.cart.includes(code);
    const v=S.txLens?txVerdict(code):null;
    const deemph = (S.eligibleOnly&&!elig&&!isDone) || (S.txLens&&v!=="direct");
    const seatTxt=a?(a.open===0?`full · ${a.secs} sec`:`${a.open} of ${a.total} seats`):"not offered this term";
    const r=rel[code];
    // progressive disclosure: in transfer-lens mode, hide AND/OR/＋ clutter (still in tooltip) so the lens reads cleanly
    const relBadge = S.txLens ? '' : (r.type==='or'?`<text class="rel-or" x="${NODEW-8}" y="36" text-anchor="end">1 of ${r.courses.length}</text>`
      : r.type==='complex'?`<text class="rel-cx" x="${NODEW-8}" y="36" text-anchor="end">⚠ verify</text>`:'');
    const txBadge = S.txLens?`<text class="tx-badge" x="${NODEW-30}" y="18" text-anchor="end" fill="${TX[v].col}">${TX[v].ic}</text>`:'';
    const extNeed=extPrereqSummary(code,inProg);
    const prText=D.prereqs[code]?.text; const tip=prText?`Prerequisite: ${prText}`:'No prerequisite';
    const ariaElig = elig ? (extNeed?`Eligible if you've also done ${extNeed}. `:'Eligible now. ') : '';
    const cls=["node","n-"+sc,incart?"incart":"",isDone?"done":"",elig?"eligible":"",deemph?"deemph":""].filter(Boolean).join(" ");
    nodes+=`<g class="${cls}" data-code="${code}" transform="translate(${p.x},${p.y})" tabindex="0" role="button" aria-label="${esc(code)} ${seatTxt}. ${isDone?'Completed. ':ariaElig}${esc(tip)}">
      <title>${esc(tip)}${extNeed?` — also needs ${esc(extNeed)} (gen-ed/placement, not tracked here)`:''}${S.txLens?` — transfers to ${esc(S.univ)}: ${v}`:''}</title>
      <rect width="${NODEW}" height="${NH}"></rect>
      <text class="code" x="11" y="20">${esc(code)} <tspan fill="#7e8a9c" font-weight="400">${cr(code)}cr</tspan></text>
      <text class="ttl" x="11" y="34">${esc((c.title||"").slice(0,28))}</text>
      <text class="seat" x="11" y="47">${isDone?'✓ completed':seatTxt}</text>
      ${!S.txLens&&elig&&extNeed?`<text class="ext-need" x="11" y="${NH-6}">＋ also: ${esc(extNeed)}</text>`:''}
      ${relBadge}${txBadge}
      ${incart&&!isDone?`<text class="cart-badge" x="${NODEW-44}" y="49" text-anchor="end">✓ cart</text>`:''}
      <circle class="done-toggle" data-done="${code}" cx="${NODEW-14}" cy="${NH-14}" r="9"/>
      ${isDone?`<text class="done-check" x="${NODEW-14}" y="${NH-10}" text-anchor="middle">✓</text>`:''}
    </g>`;
  }
  // ---- mobile fallback: per-semester list ----
  let mob="";
  for(let i=0;i<=maxL;i++){mob+=`<div class="sem"><h4>Semester ${i+1} · ${semLoad[i]||0} cr</h4>`;
    colsArr[i].forEach(c=>{const code=c.code,sc=seatClass(code),isDone=done.has(code),elig=isEligible(code),v=S.txLens?txVerdict(code):null,extNeed=extPrereqSummary(code,inProg);
      mob+=`<div class="cart-chip" data-code="${code}" style="width:100%;justify-content:space-between;${isDone?'opacity:.5':''}${S.txLens&&v!=='direct'?'opacity:.5;':''}">
        <span><i class="dot" style="background:var(--seat-${sc==='open'?'open':sc==='fill'?'fill':sc==='full'?'full':'none'})"></i> ${esc(code)} · ${cr(code)}cr ${elig?'· ⭐ eligible':''}${elig&&extNeed?` <span style="color:#b45309">＋${esc(extNeed)}</span>`:''}${S.txLens?' · '+TX[v].ic:''}</span>
        <span class="x" data-done="${code}">${isDone?'✓ done':'mark done'}</span></div>`;});
    mob+=`</div>`;}

  const eligCount=courses.filter(c=>isEligible(c.code)).length;
  // (#7) next-semester hero
  const ns=nextSemester();
  // INVARIANTS — every course must be placed on the DAG; cart must be in-program;
  // every assembler pick must have a section that the schedule can actually render.
  courses.forEach(c=>inv(pos[c.code],"DAG: no position for "+c.code));
  S.cart.forEach(code=>inv(PROGSET.has(code),"cart contains non-program course "+code));
  ns.chosen.forEach(p=>inv(p.sec.anytime||(p.sec.st>=8*60&&p.sec.en<=21.5*60&&p.sec.dl&&p.sec.dl.length),
    "assembler picked a non-renderable section: "+p.course.code));
  const nsHTML = ns.chosen.length?`
    <div class="nextsem">
      <h2>🎯 Your next semester — ${ns.credits} credits, ready to register</h2>
      <p class="sub" style="margin:2px 0 8px">The best ${ns.chosen.length} ${ns.chosen.length===1?'class':'classes'} you can take in ${esc(TERM_LABEL(S.term))}: prerequisites met, seats open, fits around your work hours, and ${term('articulation','transfer')}-friendly first.</p>
      ${ns.chosen.map(p=>`<div class="pickrow"><span class="tx-ic" style="color:${p.tx==='direct'?'var(--tx-direct)':p.tx==='elective'?'var(--tx-elective)':'#64748b'}">${({direct:'✓',elective:'≈',none:'✕',nodata:'·'})[p.tx]}</span>
        <span><b>${esc(p.course.code)}</b> ${esc((p.course.title||'').slice(0,30))}</span>
        <span class="meta">${cr(p.course.code)}cr · ${p.sec.anytime?'🖥 online/anytime':esc(p.sec.days)+' '+esc(p.sec.start)} · ${esc(COLLEGE_NAME[p.sec.college]||p.sec.college)}</span></div>`).join("")}
      <div class="row-actions">
        <button class="btn" id="nsAdd">Put these in my cart &amp; schedule →</button>
        <span class="meta">✓ counts toward your major · ≈ transfers as elective</span>
      </div>
    </div>`:`
    <div class="nextsem"><h2>🎯 Your next semester</h2><p class="sub" style="margin:2px 0 0">Mark a few courses done (tap the ◌ corner) and we'll suggest exactly what to register for next. Right now every starting course is open to you — tap any green one below.</p></div>`;
  // cost & time strip
  const ec=economics();
  const econHTML=`<div class="econ" style="margin:0 0 16px">
    <div class="stat"><b>${ec.doneCr}/${ec.totalCr} cr</b><span>done · ${ec.remainCr} to go</span></div>
    <div class="stat"><b>${ec.tuitionCost!=null?'~$'+ec.tuitionCost.toLocaleString():'—'}</b><span>est. tuition left (before aid)</span></div>
    <div class="stat"><b>~${ec.termsFT}–${ec.termsPT}</b><span>semesters left, full→part-time</span></div>
  </div>`;
  // (#9) seat-urgency nudge — courses you're eligible for that are filling/full
  const urgent=courses.filter(c=>isEligible(c.code)&&seatClass(c.code)!=='open').map(c=>c.code);
  const nudge=urgent.length?`<div class="nudge">⏰ <b>Act soon:</b> ${urgent.length} ${urgent.length===1?'class you can take is':'classes you can take are'} already filling or full this term — ${esc(urgent.slice(0,4).join(", "))}${urgent.length>4?'…':''}. Register early or have a backup.</div>`:'';
  document.getElementById("view").innerHTML=`
    <h1>Step 1 · Plan — ${esc(D.program.title)}</h1>
    <p class="sub">Each box is a class. A line means you take the lower one first (it's a ${term('prerequisite','prerequisite')}). Box color shows whether seats are open <b>this term</b>. We've sorted them into semesters (~16 credits each). Tap a class to add it to your cart; tap the ◌ corner once you've passed it.</p>
    ${nsHTML}
    ${econHTML}
    ${nudge}
    <div class="card">
      <div class="ctrlbar">
        <span class="seg"><button id="m-cart" class="${S.planMode==='cart'?'on':''}">Tap = add to cart</button><button id="m-done" class="${S.planMode==='done'?'on':''}">Tap = mark done</button></span>
        <label><input type="checkbox" id="cbElig" ${S.eligibleOnly?'checked':''}> Only eligible now (${eligCount})</label>
        <label><input type="checkbox" id="cbTx" ${S.txLens?'checked':''}> Transfer-optimized for ${esc(S.univ)}</label>
        <button class="btn ghost" id="addElig" ${eligCount?'':'disabled'}>+ Add ${eligCount} eligible to cart</button>
      </div>
      <div class="legend">
        <span><i class="dot" style="background:var(--seat-open)"></i> open</span>
        <span><i class="dot" style="background:var(--seat-fill)"></i> filling</span>
        <span><i class="dot" style="background:var(--seat-full)"></i> full</span>
        <span><i class="dot" style="background:var(--seat-none)"></i> not offered</span>
        <span><svg width="20" height="14"><circle cx="7" cy="7" r="6" fill="none" stroke="#eab308" stroke-width="2"/></svg> ⭐ eligible (in-program prereqs met)</span>
        <span style="color:#b45309">＋ also needs a gen-ed/placement course</span>
        <span style="color:#7e8a9c">◌ → ✓ = completed (saved on this device)</span>
        ${S.txLens?`<span>${TX.direct.ic} direct · ${TX.elective.ic} elective · ${TX.none.ic} no credit · ${TX.nodata.ic} no data — at ${esc(S.univ)}</span>`:''}
      </div>
      <div class="dag-wrap"><svg class="dag" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${lanes}${edges}${nodes}</svg></div>
      <div class="dag-mobile">${mob}</div>
      <div class="row-actions">
        <span class="pill">${S.cart.length} in cart · ${S.completed.length} done</span>
        <button class="btn" id="toSched" ${S.cart.length?'':'disabled'}>Schedule these ${S.cart.length||''} → </button>
        <button class="btn ghost" id="clearCart" ${S.cart.length?'':'disabled'}>Clear cart</button>
      </div>
      <div class="foot-note">Seats as of last scrape · ${esc(D.collegeName)}. Semester packing & prereq order are within this program only. "Eligible" means the <b>in-program</b> prerequisites are met; a ＋ flag means the course also has a gen-ed/placement prerequisite (e.g. college English) that isn't tracked here — hover for the exact rule. Always confirm with an advisor.</div>
    </div>`;

  function tapCourse(code){ if(seatClass(code)==="none"&&S.planMode==='cart')return;
    if(S.planMode==='done'){ toggleDone(code); }
    else { const i=S.cart.indexOf(code); if(i<0)S.cart.push(code);else S.cart.splice(i,1); go(); } }
  function toggleDone(code){ const i=S.completed.indexOf(code); if(i<0)S.completed.push(code); else S.completed.splice(i,1);
    S.cart=S.cart.filter(c=>!S.completed.includes(c)); saveDone(); go(); }
  document.querySelectorAll(".node").forEach(el=>{const code=el.dataset.code;
    el.onclick=e=>{ if(e.target.closest(".done-toggle")){toggleDone(code);return;} tapCourse(code); };
    el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tapCourse(code);}};});
  document.querySelectorAll("[data-done]").forEach(el=>el.onclick=e=>{e.stopPropagation();toggleDone(el.dataset.done);});
  document.querySelectorAll(".dag-mobile [data-code]").forEach(el=>el.onclick=e=>{if(e.target.closest("[data-done]"))return;tapCourse(el.dataset.code);});
  document.getElementById("m-cart").onclick=()=>{S.planMode="cart";go();};
  document.getElementById("m-done").onclick=()=>{S.planMode="done";go();};
  document.getElementById("cbElig").onchange=e=>{S.eligibleOnly=e.target.checked;go();};
  document.getElementById("cbTx").onchange=e=>{S.txLens=e.target.checked;go();};
  document.getElementById("addElig").onclick=()=>{courses.forEach(c=>{if(isEligible(c.code)&&!S.cart.includes(c.code))S.cart.push(c.code);});go();};
  document.getElementById("toSched").onclick=()=>{S.step=2;go();};
  document.getElementById("clearCart").onclick=()=>{S.cart=[];go();};
  const nsAdd=document.getElementById("nsAdd");
  if(nsAdd)nsAdd.onclick=()=>{ns.chosen.forEach(p=>{if(!S.cart.includes(p.course.code))S.cart.push(p.course.code);});S.step=2;go();};
}

// ================= STEP 2: SCHEDULE =================
function schedule(){
  if(!S.cart.length){
    document.getElementById("view").innerHTML=`<h1>Step 2 · Schedule</h1>
      <div class="card"><div class="empty">Your cart is empty. <b>Go back to Step 1</b> and tap courses with open seats — or use <b>"What should I take next?"</b> on the Plan page to fill it automatically.</div>
      <div class="row-actions"><button class="btn ghost" id="back1">← Back to Plan</button></div></div>`;
    document.getElementById("back1").onclick=()=>{S.step=1;go();};return;
  }
  const ROWH=24,START=8*60,END=21.5*60,PXMIN=ROWH/60; // px/min MUST equal CSS row height (24px/hr) or blocks drift off the time labels
  // gather sections (shared helper): TIMED → grid, ANYTIME (async/online/placeholder) → lane
  const {secs,anytime}=gather(S.cart,S.term);
  // dynamic day columns: Mon–Fri always, + Sat/Sun only when a section actually meets then.
  // (Weekend classes are prime for working students — they were being gathered & counted but never drawn.)
  const DOW={0:"Sun",1:"Mon",2:"Tue",3:"Wed",4:"Thu",5:"Fri",6:"Sat"};
  const dayIdx=[1,2,3,4,5]; if(secs.some(s=>s.dl.includes(6)))dayIdx.push(6); if(secs.some(s=>s.dl.includes(0)))dayIdx.push(0);
  const inGridDay=d=>dayIdx.includes(d);
  // INVARIANT — guards the "gather accepted it but render can't show it" bug class
  // (the pattern behind the online / full-day / weekend fixes). Every TIMED section must be
  // drawable: each meeting day has a column AND the time fits the grid window. If not, say so
  // loudly (console + a visible note) instead of silently dropping it.
  const unrenderable=secs.filter(s=>s.dl.some(d=>!inGridDay(d))||s.st<START||s.en>END);
  unrenderable.forEach(s=>inv(false,"schedule: unrenderable timed section "+s.code+" "+s.days+" "+s.start));
  S.cart.forEach(code=>inv(PROGSET.has(code),"schedule: cart course not in program "+code));
  const invariantNote=unrenderable.length?`<div class="nudge">⚠ <b>Heads up (data issue):</b> ${unrenderable.length} section(s) couldn't be placed on the grid — they meet outside 8 AM–9:30 PM or on an unsupported day, so they're <b>not shown above</b>. ${esc(unrenderable.slice(0,3).map(s=>s.code+" "+s.days+" "+s.start).join(", "))}${unrenderable.length>3?'…':''}</div>`:'';
  // (#conflict) feasibility: is there ONE section per course that avoids work AND each other?
  function feasibility(){
    const byCourse={};
    secs.forEach(s=>{if(s.open!==0&&!hitsWork(s))(byCourse[s.code]=byCourse[s.code]||[]).push(s);});
    anytime.forEach(s=>{if(s.open!==0)(byCourse[s.code]=byCourse[s.code]||[]).push({...s,anytime:true});}); // anytime never clashes
    const need=[...new Set(S.cart)];
    const noOption=need.filter(c=>!byCourse[c]||!byCourse[c].length);
    const solvable=need.filter(c=>byCourse[c]&&byCourse[c].length);
    const chosen=[];
    const bt=i=>{ if(i>=solvable.length)return true;
      for(const opt of byCourse[solvable[i]]){ if(!opt.anytime&&chosen.some(c=>!c.anytime&&overlaps(c,opt)))continue; chosen.push(opt); if(bt(i+1))return true; chosen.pop(); }
      return false; };
    const ok=bt(0);
    return {ok:ok&&!noOption.length, chosen:ok?[...chosen]:[], noOption};
  }
  const feas=feasibility();
  const pickKey=s=>s.code+"|"+s.college+"|"+s.start+"|"+(s.days||"any");
  const chosenSet=new Set(feas.chosen.map(pickKey));
  let cells="";
  // work blocks
  WORK.forEach(w=>w.d.forEach(d=>{ if(!inGridDay(d))return; const top=(w.s-START)*PXMIN, h=(w.e-w.s)*PXMIN;
    cells+=`<div class="sec work" data-day="${d}" style="top:${top}px;height:${h}px">${w.label}<small>${fmt(w.s)}–${fmt(w.e)}</small></div>`;}));
  secs.forEach(sec=>{const cls="col"+((sec.colIdx%4)+1);const dim=(sec.open===0||hitsWork(sec))?"dim":"";
    const pick=chosenSet.has(pickKey(sec))?"pick":"";
    sec.dl.forEach(d=>{if(!inGridDay(d))return;const top=(sec.st-START)*PXMIN,h=Math.max(18,(sec.en-sec.st)*PXMIN);
      const tag=sec.open===0?"FULL":hitsWork(sec)?"conflicts work":(sec.open+" open");
      cells+=`<div class="sec ${cls} ${dim} ${pick}" data-day="${d}" style="top:${top}px;height:${h}px" title="${esc(COLLEGE_NAME[sec.college])} ${esc(sec.code)} ${esc(sec.start)}–${esc(sec.end||'')}${pick?' — part of a conflict-free combination':''}">${esc(sec.code)} · ${esc(COLLEGE_NAME[sec.college])}<small>${tag} · ${esc(sec.start)}</small></div>`;});});
  // build grid rows
  let rows="";
  for(let m=START;m<END;m+=60){rows+=`<tr><td class="time">${fmt(m)}</td>`+dayIdx.map(d=>`<td data-day="${d}" data-min="${m}"></td>`).join("")+`</tr>`;}
  // mobile list
  let mob="";
  dayIdx.forEach(d=>{const dn=DOW[d];const list=secs.filter(s=>s.dl.includes(d));
    mob+=`<div style="margin:8px 0"><div style="color:var(--muted);font-size:12px;font-weight:700;margin-bottom:4px">${dn}</div>`;
    if(WORK.some(w=>w.d.includes(d)))mob+=`<div class="cart-chip" style="width:100%;border-style:dashed">Work shift · 3:00–7:00 PM</div>`;
    list.forEach(s=>mob+=`<div class="cart-chip ${s.open===0?'':''}" style="width:100%;${s.open===0||hitsWork(s)?'opacity:.45':''}">${esc(s.code)} · ${esc(COLLEGE_NAME[s.college])} · ${esc(s.start)} · ${s.open===0?'FULL':s.open+' open'}</div>`);
    if(!list.length&&!WORK.some(w=>w.d.includes(d)))mob+=`<div style="color:var(--muted);font-size:12px">—</div>`;
    mob+=`</div>`;});

  // ANYTIME lane (async/online + untimed) — grouped by course, sorted open-first
  let anytimeHTML="";
  if(anytime.length){
    const onlineCount=anytime.filter(s=>/online|zoom/i.test(s.mode||"")).length;
    const byCode={}; anytime.forEach(s=>{(byCode[s.code]=byCode[s.code]||[]).push(s);});
    const chips=Object.entries(byCode).map(([code,list])=>{
      list.sort((a,b)=>(b.open||0)-(a.open||0));
      return `<div style="margin:6px 0 10px"><div style="font-size:12px;font-weight:700;color:#cbd2de;margin-bottom:5px">${esc(code)}</div>`+
        list.map(s=>{const isOnline=/online|zoom/i.test(s.mode||"");const dim=s.open===0?'opacity:.4':'';
          return `<span class="cart-chip" style="${dim};border-left:3px solid var(--col${(s.colIdx%4)+1})">
            ${esc(COLLEGE_NAME[s.college]||s.college)} · ${isOnline?'🖥 online · anytime':'no scheduled time'} · ${s.open===0?'FULL':s.open+' open'}</span>`;}).join(" ")+`</div>`;
    }).join("");
    anytimeHTML=`<div class="card" style="margin-top:14px">
      <h1 style="font-size:15px">Anytime — no fixed meeting time <span class="pill" style="vertical-align:middle">${anytime.length} section${anytime.length===1?'':'s'}${onlineCount?` · ${onlineCount} online`:''}</span></h1>
      <p class="sub">These never clash with your work hours — the most flexible option, and the one a time-grid alone would hide. ${onlineCount?'Online sections are asynchronous unless noted.':''}</p>
      ${chips}</div>`;
  }
  // feasibility banner
  const pickList=feas.chosen.map(s=>`${s.code} (${s.anytime?'anytime/online':esc(s.days)+' '+esc(s.start)}, ${COLLEGE_NAME[s.college]||s.college})`).join(" · ");
  const feasBanner = !S.cart.length?"" : feas.ok
    ? `<div class="empty" style="text-align:left;border-color:#16a34a;background:#0f1f17"><b style="color:#34d399">✓ All ${S.cart.length} fit together</b> around your work hours — outlined below: ${esc(pickList)}</div>`
    : feas.noOption.length
      ? `<div class="empty" style="text-align:left;border-color:#b45309;background:#1f1710"><b style="color:#f59e0b">⚠ No open section this term</b> for: ${feas.noOption.map(esc).join(", ")}. Try another term above, drop it from the cart, or check the Anytime lane.</div>`
      : `<div class="empty" style="text-align:left;border-color:#b45309;background:#1f1710"><b style="color:#f59e0b">⚠ These ${S.cart.length} can't all fit</b> around your work block in one week — at least two only meet at overlapping times. Drop one, switch a section to online (Anytime lane), or adjust your work hours.</div>`;
  const colChips=COLLEGE_ORDER.map((c,i)=>`<span><i class="dot" style="background:var(--col${i+1})"></i> ${COLLEGE_NAME[c]}</span>`).join("");
  // (#13) comparator summary — make the unique multi-college value legible at a glance
  const collegesShown=new Set([...secs,...anytime].map(s=>s.college)).size;
  const openTimed=secs.filter(s=>s.open!==0&&!hitsWork(s)).length;
  document.getElementById("view").innerHTML=`
    <h1>Step 2 · Schedule — fit your ${S.cart.length} planned course${S.cart.length===1?'':'s'}</h1>
    <p class="sub">The same class, across every nearby college, on one week — so you can grab the section that fits your life. Timed classes sit on the grid; no-fixed-time ones are in the <b>Anytime</b> lane. Your work hours are blocked; full or clashing sections are dimmed; a <b style="color:#34d399">combination with no conflicts</b> is outlined in green.</p>
    <div class="card">
      <div class="comparator-summary">
        <span>📅 <b>${esc(TERM_LABEL(S.term))}</b></span>
        <span>🏫 <b>${collegesShown}</b> colleges compared</span>
        <span>🎟 <b>${openTimed}</b> open timed sections${anytime.length?` · <b>${anytime.length}</b> anytime/online`:''}</span>
        <span>${feas.ok?'<b style="color:#34d399">✓ a conflict-free combo exists</b>':'<b style="color:#f59e0b">⚠ tight fit — see note</b>'}</span>
      </div>
      ${feasBanner}
      ${invariantNote}
      <div class="cart-bar">${S.cart.map(c=>`<span class="cart-chip">${esc(c)} <span class="x" data-rm="${c}">✕</span></span>`).join("")}</div>
      <div class="legend">${colChips}<span><i class="dot" style="background:#404a5a"></i> Your work hours</span><span><svg width="16" height="12"><rect x="1" y="1" width="14" height="10" rx="2" fill="none" stroke="#34d399" stroke-width="2"/></svg> conflict-free pick</span><span>dimmed = full / conflict</span></div>
      ${secs.length?`<div class="grid-desktop"><table class="grid"><thead><tr><th class="time"></th>${dayIdx.map(d=>`<th>${DOW[d]}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
      <div class="grid-mobile">${mob}</div>`:`<div class="empty">No <b>timed</b> sections for these courses in ${S.term} — but see the Anytime lane below.</div>`}
    </div>
    ${anytimeHTML}
    <div class="card"><div class="row-actions">
        <button class="btn ghost" id="back1">← Plan</button>
        <button class="btn" id="toTx">Check transfer → </button>
      </div>
      <div class="foot-note">Work hours are an illustrative block (Mon/Wed/Fri 3–7pm). Seats & meeting times as of last scrape. Sections without published days/times appear in the Anytime lane, not the grid.</div>
    </div>`;
  // place cells into their day columns
  document.querySelectorAll(".grid-desktop td[data-day]").forEach(td=>{ if(+td.dataset.min!==START)return; });
  // simpler: absolutely position within first row cell of each day -> append to the day's column wrapper
  // We append each .sec to the <td> at START row for its day.
  const startCells={};document.querySelectorAll(`.grid-desktop td[data-day][data-min="${START}"]`).forEach(td=>startCells[td.dataset.day]=td);
  const tmp=document.createElement("div");tmp.innerHTML=cells;
  [...tmp.children].forEach(el=>{const d=el.dataset.day;if(startCells[d]){startCells[d].style.position="relative";startCells[d].appendChild(el);}});
  document.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{S.cart=S.cart.filter(c=>c!==x.dataset.rm);go();});
  document.getElementById("back1").onclick=()=>{S.step=1;go();};
  document.getElementById("toTx").onclick=()=>{S.step=3;go();};
}
function fmt(m){let h=Math.floor(m/60),ap=h>=12?"PM":"AM",hh=h%12||12;return hh+(m%60?":"+String(m%60).padStart(2,"0"):"")+" "+ap;}

// ================= STEP 3: TRANSFER (proportional Sankey) =================
function transfer(){
  const planned=S.cart.length?S.cart:allCourses().map(c=>c.code);
  const all=D.transfersByUniv[S.univ]||[];
  const rank={direct:3,elective:2,none:1,unknown:0};
  const cr=code=>D.credits[code]||3;
  const rows=planned.map(code=>{
    const matches=all.filter(x=>x.cc===code)
      .map(t=>({cc:code,univ:t.univ,univTitle:t.univTitle,status:t.noCredit?"none":t.elective?"elective":"direct"}));
    const best=matches.length?matches.sort((a,b)=>rank[b.status]-rank[a.status])[0]:{cc:code,status:"unknown"};
    return {...best, cr:cr(code)};
  });
  // order courses by outcome so ribbons don't cross
  const ORDER={direct:0,elective:1,none:2,unknown:3};
  rows.sort((a,b)=>ORDER[a.status]-ORDER[b.status] || b.cr-a.cr);
  const BUCKETS=[
    {k:"direct",label:"Direct major credit",cls:"rib-direct",ic:"✓"},
    {k:"elective",label:"Generic elective only",cls:"rib-elective",ic:"≈"},
    {k:"none",label:"No credit awarded",cls:"rib-none",ic:"✕"},
    {k:"unknown",label:"No transfer data",cls:"rib-nodata",ic:"?"},
  ].filter(b=>rows.some(r=>r.status===b.k));
  const totalCr=rows.reduce((a,r)=>a+r.cr,0)||1;
  // (#4) FAIR denominator: exclude no-data from the score
  const withData=rows.filter(r=>r.status!=="unknown");
  const directCr=rows.filter(r=>r.status==="direct").reduce((a,r)=>a+r.cr,0);
  const withDataCrRaw=withData.reduce((a,r)=>a+r.cr,0); // real credits-with-data (0 is possible)
  const withDataCr=withDataCrRaw||1;                    // guard division only
  const directPct=Math.round(100*directCr/withDataCr);
  const noDataCr=totalCr-withDataCrRaw;
  // INVARIANTS — no planned course silently dropped from the flow; every status maps to a bucket
  inv(rows.length===planned.length,"transfer: dropped "+(planned.length-rows.length)+" planned course(s)");
  rows.forEach(r=>inv(BUCKETS.some(b=>b.k===r.status),"transfer: no bucket for status '"+r.status+"' ("+r.cc+")"));

  // ---- proportional ribbon Sankey ----
  const PADT=44, PADB=16, W=900, AX=120, BX=380, CX=720, GAPC=4;
  const colCr=totalCr;
  const totalGap=GAPC*Math.max(rows.length-1,0);
  const avail=Math.max(260, rows.length*26);
  const SCALE=(avail-totalGap)/colCr; // px per credit
  const colH=colCr*SCALE+totalGap;
  const H=PADT+colH+PADB;
  // hub band (col A)
  let ribbons="",nodesA="",nodesB="",nodesC="";
  const hubTop=PADT, hubBot=PADT+colH;
  nodesA=`<rect x="${AX-10}" y="${hubTop}" width="10" height="${colH}" rx="2" fill="var(--accent)"/>
    <text class="snode" x="${AX-18}" y="${hubTop-8}" text-anchor="end" font-weight="700">Your plan</text>
    <text class="snode-sub" x="${AX-18}" y="${(hubTop+hubBot)/2}" text-anchor="end">${rows.length} courses · ${totalCr} cr</text>`;
  // course bands (col B), stacked in sorted order; hub ribbons align to same stack
  let yB=PADT;
  const fillFor=s=>({direct:"var(--tx-direct)",elective:"var(--tx-elective)",none:"var(--tx-none)",unknown:"#475569"}[s]);
  const ribCls=s=>({direct:"rib-direct",elective:"rib-elective",none:"rib-none",unknown:"rib-nodata"}[s]);
  // precompute bucket band geometry (col C)
  const bucketCr={}; BUCKETS.forEach(b=>bucketCr[b.k]=rows.filter(r=>r.status===b.k).reduce((a,r)=>a+r.cr,0));
  let yC=PADT; const bucketTop={};
  BUCKETS.forEach(b=>{bucketTop[b.k]=yC; const h=bucketCr[b.k]*SCALE; yC+=h+GAPC;});
  const bucketCursor={}; BUCKETS.forEach(b=>bucketCursor[b.k]=bucketTop[b.k]);
  let hubCursor=hubTop;
  rows.forEach(r=>{const h=r.cr*SCALE;
    // hub -> course ribbon
    ribbons+=ribbon(AX, hubCursor, hubCursor+h, BX-10, yB, yB+h, ribCls(r.status));
    hubCursor+=h;
    // course band
    nodesB+=`<rect x="${BX-10}" y="${yB}" width="10" height="${Math.max(2,h)}" rx="2" fill="${fillFor(r.status)}"/>
      <text class="snode" x="${BX+4}" y="${yB+Math.max(11,h/2+3)}">${esc(r.cc)} <tspan class="snode-sub">${r.cr}cr</tspan></text>`;
    // course -> bucket ribbon (starts at the bar's right edge so it stays attached)
    const cy=bucketCursor[r.status]; ribbons+=ribbon(BX, yB, yB+h, CX, cy, cy+h, ribCls(r.status));
    bucketCursor[r.status]+=h;
    yB+=h+GAPC;
  });
  BUCKETS.forEach(b=>{const top=bucketTop[b.k],h=bucketCr[b.k]*SCALE;
    nodesC+=`<rect x="${CX}" y="${top}" width="10" height="${Math.max(2,h)}" rx="2" fill="${fillFor(b.k)}"/>
      <text class="snode" x="${CX+16}" y="${top+Math.max(13,h/2)}"><tspan class="txicon" fill="${fillFor(b.k)}">${b.ic}</tspan> ${b.label}</text>
      <text class="snode-sub" x="${CX+16}" y="${top+Math.max(13,h/2)+13}">${bucketCr[b.k]} cr · ${rows.filter(r=>r.status===b.k).length} courses</text>`;});

  function ribbon(x0,y0a,y0b,x1,y1a,y1b,cls){const mx=(x0+x1)/2;
    return `<path class="ribbon ${cls}" d="M${x0},${y0a} C${mx},${y0a} ${mx},${y1a} ${x1},${y1a} L${x1},${y1b} C${mx},${y1b} ${mx},${y0b} ${x0},${y0b} Z"/>`;}

  const univOpts=UNIVS.map(u=>`<option ${u===S.univ?'selected':''}>${esc(u)}</option>`).join("");
  document.getElementById("view").innerHTML=`
    <h1>Step 3 · Transfer — will my plan count?</h1>
    <p class="sub">A true flow diagram: <b>ribbon width = credits</b>, so you see the <i>magnitude</i> of what does and doesn't carry over. Transfer status has its own visual language (✓ ≈ ✕) so it's never confused with seat colors. Courses with no published mapping are shown separately — they don't count against the score.</p>
    <div class="card">
      <div class="tx-head">Transfer to <select id="univSel">${univOpts}</select> · ${withDataCrRaw===0?`<b>None of your ${rows.length} planned course${rows.length===1?' has':'s have'} published transfer data to ${esc(S.univ)} yet.</b>`:`<b>${directCr} of ${withDataCrRaw} credits (${directPct}%)</b> with transfer data count directly toward a major${noDataCr?` · <span style="color:var(--muted)">${noDataCr} cr have no data</span>`:''}.`}</div>
      <div class="legend">
        <span><span class="txicon" style="color:var(--tx-direct)">✓</span> Direct major credit</span>
        <span><span class="txicon" style="color:var(--tx-elective)">≈</span> Generic elective only</span>
        <span><span class="txicon" style="color:var(--tx-none)">✕</span> No credit</span>
        <span><span class="txicon" style="color:#94a3b8">?</span> No data (excluded from %)</span>
      </div>
      <div class="sankey-wrap"><svg class="sankey" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
        <text class="colHdr" x="${BX-10}" y="26">Your courses</text>
        <text class="colHdr" x="${CX}" y="26">At ${esc(S.univ).slice(0,26)}</text>
        ${ribbons}${nodesA}${nodesB}${nodesC}</svg></div>
      ${directPct<40?`<div class="empty" style="text-align:left">⚠ <b>Heads up:</b> only ${directPct}% of credits-with-data transfer as major credit to ${esc(S.univ)} — typical for a technical A.S. Try another university above, or ask an advisor about a transfer-focused pathway. (Tip: turn on "Transfer-optimized" in Step 1 to see which courses to prioritize.)</div>`:""}
      <div class="row-actions"><button class="btn ghost" id="back2">← Schedule</button><button class="btn" id="toOut">See outcomes → </button></div>
      <div class="foot-note">Source: published GA transfer-equivalency data. "Generic elective" = credit transfers but doesn't satisfy a specific requirement. Verify against the current articulation agreement before relying on it.</div>
    </div>`;
  document.getElementById("univSel").onchange=e=>{S.univ=e.target.value;go();};
  document.getElementById("back2").onclick=()=>{S.step=2;go();};
  document.getElementById("toOut").onclick=()=>{S.step=4;go();};
}

// ================= STEP 4: OUTCOMES =================
function outcomes(){
  const e=D.outcomes.earnings||{};
  const np=D.outcomes.cost&&D.outcomes.cost.netPriceByIncome||{};
  // (#15) ROI narrative — what this plan costs vs what graduates earn (all real data, honest caveats)
  const ec=economics(); const med10=e.median10YrsAfterEntry; const stMed=D.stateEarningsMedian;
  const years=ec.remainCr/30; // net price is ANNUAL (~30 cr/yr) — multiply by YEARS, not semesters
  const roiHTML = (med10&&ec.tuitionCost!=null)?`
    <div class="nextsem" style="background:linear-gradient(135deg,#10231f,#1b2330)">
      <h2>💸 Is it worth it? — the honest math</h2>
      <div class="econ" style="margin-top:8px">
        <div class="stat"><b>~$${ec.tuitionCost.toLocaleString()}</b><span>tuition for the degree (before aid)</span></div>
        ${ec.lowIncomeNet!=null&&ec.lowIncomeNet<0?`<div class="stat"><b style="color:#60a5fa">+$${Math.abs(Math.round(ec.lowIncomeNet*years)).toLocaleString()}</b><span>a low-income student may net over the degree (aid &gt; cost)</span></div>`:''}
        <div class="stat"><b>$${med10.toLocaleString()}</b><span>median earnings, 10 yrs in</span></div>
        <div class="stat"><b>${stMed&&med10>=stMed?'＋':'−'}$${Math.abs(med10-(stMed||0)).toLocaleString()}</b><span>vs GA CC median ($${(stMed||0).toLocaleString()})</span></div>
      </div>
      <p class="foot-note" style="border-color:rgba(255,255,255,.08)">In plain terms: the tuition is roughly <b>${Math.max(1,Math.round(ec.tuitionCost/(med10/12)))} month${Math.round(ec.tuitionCost/(med10/12))===1?'':'s'}</b> of a typical graduate's pay${ec.lowIncomeNet!=null&&ec.lowIncomeNet<0?', and many lower-income students pay little or nothing after aid':''}. ${e.shareEarningAboveHsGrad!=null?Math.round(e.shareEarningAboveHsGrad*100)+'% of students out-earn a typical high-school grad.':''} These are college-wide federal figures, not a guarantee — your field and finishing both matter.</p>
    </div>`:'';
  // (#5) earnings range vs PEERS + state median reference line
  const lo=10000,hi=70000,scale=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));
  const peers=(D.peerEarnings||[]);
  const anchor=peers.find(p=>p.slug===D.college);
  // show top 5 + anchor (always), keep sorted by median desc
  const show=[]; const top=peers.slice(0,5); top.forEach(p=>show.push(p));
  if(anchor&&!show.includes(anchor))show.push(anchor);
  show.sort((a,b)=>b.med-a.med);
  inv(!anchor||show.includes(anchor),"outcomes: anchor college missing from earnings chart");
  const stateMed=D.stateEarningsMedian;
  const medLine=stateMed?`<div style="position:absolute;left:calc(${scale(stateMed)}% );top:-2px;bottom:14px;border-left:2px dashed #94a3b8" title="state median $${stateMed.toLocaleString()}"></div>`:'';
  const rangeBar=peers.length?`
    <div style="position:relative">
    ${show.map(p=>{const isA=p.slug===D.college;
      return `<div class="range-row"><span class="nm" style="${isA?'color:var(--accent);font-weight:700':''}">${esc(p.name).slice(0,12)}</span>
        <div class="track"><div class="range" style="left:${scale(p.p25)}%;width:${scale(p.p75)-scale(p.p25)}%;${isA?'background:linear-gradient(90deg,#fbbf2466,#f59e0b)':''}"></div>
        <div class="med" style="left:${scale(p.med)}%"></div></div>
        <span style="color:${isA?'var(--accent)':'var(--muted)'};font-size:11px;width:54px;text-align:right">$${(p.med/1000).toFixed(0)}k</span></div>`;}).join("")}
    <div style="position:absolute;left:70px;right:54px;top:0;bottom:14px;pointer-events:none">${medLine}</div>
    </div>
    <div style="display:flex;justify-content:space-between;color:var(--muted);font-size:10.5px;margin:2px 70px 0 70px"><span>$10k</span><span>·· state median $${(stateMed/1000).toFixed(0)}k ··</span><span>$70k+</span></div>`
    :`<div class="empty">No earnings data reported.</div>`;
  // net price by income (note: can be negative = aid exceeds cost)
  const bands=[["0_30000","$0–30k"],["30001_48000","$30–48k"],["48001_75000","$48–75k"],["75001_110000","$75–110k"],["110001_plus","$110k+"]];
  const vals=bands.map(b=>np[b[0]]);
  const maxAbs=Math.max(...vals.filter(v=>v!=null).map(Math.abs),1);
  const npBars=bands.map((b,i)=>{const v=vals[i];
    if(v==null)return`<div class="bcol"><div class="bar" style="height:6px;opacity:.25"></div></div>`;
    const h=Math.max(6,Math.abs(v)/maxAbs*100);
    return`<div class="bcol ${i===0?'hl-band':''}"><div class="bar ${v<0?'neg':'pos'}" style="height:${h}%"><b>${v<0?'+$'+Math.abs(v).toLocaleString():'$'+v.toLocaleString()}</b></div></div>`;}).join("");
  const npLabs=bands.map((b,i)=>`<div class="bcol"><div class="blab">${i===0?'<b style="color:var(--accent)">'+b[1]+'</b><br>your band':b[1]}${vals[i]==null?'<br><span style="opacity:.4">n/a</span>':''}</div></div>`).join("");
  // Pell vs non-Pell — atlanta-tech is fully suppressed -> show empty state (demonstrates requirement)
  const pellRows=(D.programEarnings||[]).filter(p=>p.pell!=null&&p.nonPell!=null);
  let pellHTML;
  if(pellRows.length){const mx=Math.max(...pellRows.flatMap(p=>[p.pell,p.nonPell]));
    pellHTML=pellRows.slice(0,3).map(p=>`<div style="margin:10px 0"><div style="font-size:12px;color:#cbd2de;margin-bottom:5px">${esc(p.cip.slice(0,36))}</div>
      <div style="display:flex;align-items:center;gap:8px;font-size:11px;margin:3px 0"><span style="width:64px;color:var(--muted)">Pell</span><div style="height:15px;border-radius:4px;background:#a78bfa;width:${p.pell/mx*100}%"></div><span>$${p.pell.toLocaleString()}</span></div>
      <div style="display:flex;align-items:center;gap:8px;font-size:11px;margin:3px 0"><span style="width:64px;color:var(--muted)">Non-Pell</span><div style="height:15px;border-radius:4px;background:#2dd4bf;width:${p.nonPell/mx*100}%"></div><span>$${p.nonPell.toLocaleString()}</span></div></div>`).join("");
  } else {
    pellHTML=`<div class="empty">⚖ <b>Not enough graduates to report</b> Pell vs non-Pell earnings at ${esc(D.collegeName)} — the federal cohort is too small to publish without risking individual privacy. This is shown honestly rather than estimated.</div>`;
  }
  // program 1-yr earnings (real, present)
  const y1=(D.programEarnings||[]).filter(p=>p.y1!=null).slice(0,5);
  const y1HTML=y1.length?`<div class="card"><h1 style="font-size:15px">Median earnings 1 year after completing — by program</h1>
    <p class="sub">Real per-program outcomes at ${esc(D.collegeName)} (federal data).</p>
    ${y1.map(p=>{const w=p.y1/Math.max(...y1.map(x=>x.y1))*100;return`<div style="display:flex;align-items:center;gap:8px;font-size:12px;margin:6px 0"><span style="width:200px;color:#cbd2de">${esc(p.cip.slice(0,32))}</span><div style="height:16px;border-radius:4px;background:linear-gradient(90deg,#34d399,#059669);width:${w*0.6}%"></div><span style="color:var(--muted)">$${p.y1.toLocaleString()}</span></div>`;}).join("")}</div>`:"";

  document.getElementById("view").innerHTML=`
    <h1>Step 4 · Outcomes — what happens after ${esc(D.collegeName)}</h1>
    <p class="sub">Federal ${term('college scorecard','College Scorecard')} data for this college. The numbers to weigh before committing — with the gaps shown honestly where the federal cohort is too small.</p>
    ${roiHTML}
    <div class="oc-grid">
      <div class="card" style="grid-column:1 / -1"><h1 style="font-size:15px">Earnings 10 years after entry — ${esc(D.collegeName).split(" ")[0]} vs peers</h1>
        <p class="sub">Bar = 25th–75th percentile; white tick = median; dashed line = state median. Your college is highlighted — context beats a single number.</p>${rangeBar}
        <div class="foot-note">${anchor&&stateMed?`${esc(D.collegeName).split(" ")[0]}'s median ($${anchor.med.toLocaleString()}) is ${anchor.med>=stateMed?'above':'below'} the GA community-college median ($${stateMed.toLocaleString()}).`:''} ${e.shareEarningAboveHsGrad!=null?Math.round(e.shareEarningAboveHsGrad*100)+"% earn more than a typical high-school grad.":""}</div></div>
      <div class="card"><h1 style="font-size:15px">What you'll actually pay</h1>
        <p class="sub">Net price after aid, by family income. <b style="color:#60a5fa" title="When grant &amp; scholarship aid exceeds the federal estimate of total cost of attendance, the published net price is negative — students can receive a refund toward living costs.">Blue / ＋ = aid exceeds cost ⓘ</b></p>
        <div class="bars">${npBars}</div><div class="bars" style="height:auto;border:none;padding-top:4px">${npLabs}</div>
        <div class="foot-note">Sticker tuition is $${(D.outcomes.tuition||0).toLocaleString()}; a $0–30k family here actually nets ${vals[0]<0?'+$'+Math.abs(vals[0]).toLocaleString()+' back (aid &gt; cost of attendance)':'$'+vals[0]}. Source: federal College Scorecard net-price-by-income.</div></div>
      <div class="card"><h1 style="font-size:15px">Equity check — Pell vs non-Pell</h1>
        <p class="sub">Median earnings by financial-aid background.</p>${pellHTML}</div>
      ${y1HTML}
    </div>
    <div class="card"><div class="row-actions"><button class="btn ghost" id="back3">← Transfer</button><button class="btn" id="restart">Start a new plan</button></div></div>`;
  document.getElementById("back3").onclick=()=>{S.step=3;go();};
  document.getElementById("restart").onclick=()=>{S.cart=[];S.step=1;go();};
}

function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("ccp-theme",t);}catch{}}
(function initTheme(){let t="dark";try{t=localStorage.getItem("ccp-theme")||"dark";}catch{} if(t==="light")setTheme("light");})();

// ---------- boot ----------
loadURL();go();
})();
