name: Seat Watch Cron

on:
  schedule:
    # Run daily at 8am UTC (reasonable time for students to see the notification)
    - cron: "0 8 * * *"
  workflow_dispatch: # manual trigger for testing

jobs:
  seat-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run seat-watch cron
        run: npx tsx scripts/seat-watch-cron.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SITE_URL: https://communitycollegepath.com
