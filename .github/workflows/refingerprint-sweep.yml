name: Refingerprint sweep

# Monthly re-fingerprint of every college in every currently-supported
# state. Writes data/state-health/fingerprint-baseline.json (committed)
# and diffs against the prior baseline to detect SIS migrations BEFORE
# they break the scheduled scrapers.
#
# Triggers:
#   - 1st of every month at 13:00 UTC (Mon-Fri only via cron is finicky;
#     plain monthly is fine — sweep takes ~20-30 min)
#   - workflow_dispatch for manual invocation
#
# On detected platform changes: opens or updates a rolling issue
# "Refingerprint diff — SIS migrations detected" with the per-college
# transitions, so the user can update scraper templates or registry
# entries before the next scheduled-scrape tick.
#
# Permissions: contents:write (to commit baseline); issues:write

on:
  schedule:
    - cron: "0 13 1 * *"
  workflow_dispatch:
    inputs:
      states:
        description: "Comma-separated state slugs to sweep (default: all supported)"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run refingerprint sweep
        id: sweep
        run: |
          STATES_ARG=""
          if [ -n "${{ inputs.states }}" ]; then
            STATES_ARG="--states ${{ inputs.states }}"
          fi
          npx tsx scripts/lib/refingerprint-sweep.ts \
            $STATES_ARG \
            --concurrency 6 \
            --diff-out /tmp/refingerprint-diff.json
          echo "diff_count=$(jq -r '.diffCount' /tmp/refingerprint-diff.json)" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<DIFF_BODY_EOF'
            echo '# Refingerprint diff — SIS migrations detected'
            echo
            jq -r '"Generated: \(.generatedAt)\n\n**\(.diffCount) platform change(s) since last sweep.**"' /tmp/refingerprint-diff.json
            echo
            jq -r 'if .diffCount > 0 then "## Changes\n\n| State | College | From | To | Confidence | URL |\n| --- | --- | --- | --- | --- | --- |\n\(.diffs | map("| `\(.state)` | \(.name) | \(.fromPlatform) (\(.fromConfidence)) | \(.toPlatform) (\(.toConfidence)) | \(.toConfidence) | <\(.primaryUrl)> |") | join("\n"))\n\n## Why this matters\n\nA platform change is the earliest signal that a college has migrated SIS — typically months before scheduled-scrape would notice. If the new platform is templated (banner-ssb-9, colleague, banner-8, jenzabar), the next step is to update the state'\''s `scrapers` declaration. If not, the college needs a bespoke scraper or moves to the auth-gated/skipped bucket." else "No platform changes detected since last sweep." end' /tmp/refingerprint-diff.json
            echo 'DIFF_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Commit updated baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ ! -f data/state-health/fingerprint-baseline.json ]; then
            echo "No baseline produced; skipping commit."
            exit 0
          fi
          git config user.name "state-health-bot"
          git config user.email "state-health-bot@users.noreply.github.com"
          git add data/state-health/fingerprint-baseline.json
          if git diff --cached --quiet; then
            echo "Baseline unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore(state-health): refingerprint sweep $(date -u +%Y-%m-%d)" \
            -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Retry on push race (same pattern as state-health history-out workflow).
          attempt=0
          max_attempts=5
          until [ $attempt -ge $max_attempts ]; do
            attempt=$((attempt + 1))
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              echo "Pushed baseline on attempt ${attempt}."
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Failed to push baseline after ${max_attempts} attempts." >&2
          exit 1

      - name: Update rolling refingerprint-diff issue
        if: steps.sweep.outputs.diff_count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.sweep.outputs.body }}
          DIFF_COUNT: ${{ steps.sweep.outputs.diff_count }}
        run: |
          set -e
          title="Refingerprint diff — SIS migrations detected"
          existing=$(gh issue list \
            --search "in:title \"${title}\"" \
            --state all \
            --limit 5 \
            --json number,state,title \
            --jq ".[] | select(.title == \"${title}\") | .number" \
            | head -n 1)

          printf '%s\n' "$BODY" > /tmp/issue-body.md

          if [ -z "$existing" ]; then
            if [ "$DIFF_COUNT" = "0" ]; then
              echo "First run, no platform changes — not opening an issue."
              exit 0
            fi
            gh issue create \
              --title "${title}" \
              --body-file /tmp/issue-body.md \
              --label "fingerprint-drift,automated"
            exit 0
          fi

          gh issue edit "$existing" --body-file /tmp/issue-body.md

          state=$(gh issue view "$existing" --json state --jq .state)
          if [ "$DIFF_COUNT" = "0" ] && [ "$state" = "OPEN" ]; then
            gh issue close "$existing" --comment "No platform changes on the latest sweep. Closing — will reopen automatically if a future sweep finds migrations."
          elif [ "$DIFF_COUNT" != "0" ] && [ "$state" = "CLOSED" ]; then
            gh issue reopen "$existing" --comment "Reopening — the latest refingerprint sweep detected new platform changes."
          fi
