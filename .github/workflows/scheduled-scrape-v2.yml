name: Scheduled scrape (unified)

# Unified scheduled-scrape workflow (issue #59, PR 2; per-state PRs in
# issue #169). Replaces the VA-only weekly-scrape-va.yml exemplar (#58).
# Reads StateConfig.scrapers to build its matrix, so adding a state to
# cron is a config edit, not a YAML edit.
#
# Pipeline:
#   plan      — emit scrape matrix + aggregate states list
#   scrape    — matrix over ScrapeJobs (parallel; one runner each)
#   aggregate — matrix over states (parallel; one PR each)
#   health    — single runner; rolling issue per datatype
#
# Per-state aggregate (issue #169): each state opens its own PR keyed by
# `scheduled-scrape/{state}-{datatype}`, so a fast state's data isn't
# blocked by a slow state's scrape finishing. Cross-state coupling lives
# only in `health`, which intentionally needs the whole picture.
#
# Runs `--no-import` only. The scraped JSON never touches Supabase from
# this workflow — a human merges the per-state PR, then
# scripts/import-courses.ts picks up the files on main and runs schema
# validation (#49) + change detection (#51) before any row lands.
#
# Three crons, one per data type. `github.event.schedule` tells us which
# fired. Manual dispatch accepts a `datatype` input.
#
# The four legacy scrape-*.yml files were retired in PR 3 of #59.

on:
  schedule:
    - cron: "0 6 * * 1,3,5" # Mon/Wed/Fri 06:00 UTC — courses
    - cron: "0 10 * * 3,6"  # Wed/Sat 10:00 UTC — transfers
    - cron: "0 7 * * 0"     # Sun 07:00 UTC — prereqs
    - cron: "0 8 1 * *"     # 1st of month 08:00 UTC — programs
  workflow_dispatch:
    inputs:
      datatype:
        description: "Which data type to scrape"
        type: choice
        options: [courses, transfers, prereqs, programs]
        default: courses

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      states: ${{ steps.plan.outputs.states }}
      datatype: ${{ steps.plan.outputs.datatype }}
      empty: ${{ steps.plan.outputs.empty }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      - name: Determine datatype
        id: datatype
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            dt="${{ inputs.datatype }}"
          else
            case "${{ github.event.schedule }}" in
              "0 6 * * 1,3,5") dt="courses" ;;
              "0 10 * * 3,6")  dt="transfers" ;;
              "0 7 * * 0")     dt="prereqs" ;;
              "0 8 1 * *")     dt="programs" ;;
              *) echo "Unexpected schedule: ${{ github.event.schedule }}"; exit 1 ;;
            esac
          fi
          echo "value=$dt" >> "$GITHUB_OUTPUT"
          echo "Running scheduled scrape for datatype=$dt" >&2

      - name: Build matrix from registry
        id: plan
        run: |
          dt="${{ steps.datatype.outputs.value }}"
          matrix=$(npx tsx scripts/lib/scraper-matrix.ts --datatype "$dt")
          # Per-state aggregate matrix (issue #169) — includes states with
          # explicit ScrapeJobs *and* prereqs-via-aggregate-from-courses
          # states whose prereqs.json refreshes off committed course data.
          states=$(npx tsx scripts/lib/scraper-matrix.ts --datatype "$dt" --mode states)
          count=$(echo "$matrix" | jq '.include | length')
          state_count=$(echo "$states" | jq '.states | length')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "states=$states" >> "$GITHUB_OUTPUT"
          echo "datatype=$dt" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ] && [ "$state_count" = "0" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "No states declare scheduled $dt scraping or aggregation. Nothing to do." >&2
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
            echo "Scrape matrix: $count entries; aggregate matrix: $state_count states." >&2
          fi

  scrape:
    needs: plan
    if: needs.plan.outputs.empty == 'false'
    runs-on: ubuntu-latest
    # 360 (not 200) so VA's PeopleSoft scrape can finish all three
    # terms (Spring/Summer/Fall) end-to-end. Run 25268053426 verified
    # the PS scraper produces ~24k sections for the first two terms in
    # ~120 min; Fall iteration adds ~60 min. Spring may run concurrently
    # in May, pushing total to ~240–270 min. 360 gives comfortable headroom.
    # Other states finish well under 60 — this is the worst-case ceiling.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      - name: Install Playwright (runner-dependent)
        if: matrix.runner == 'playwright'
        run: npx playwright install chromium --with-deps

      - name: Install pdfplumber (NC scrapers shell out to Python for PDF parsing)
        # scripts/nc/scrape-pamlico.ts and scrape-cleveland.ts call
        # `python3 -c '... pdfplumber ...'` to parse college-published PDF
        # course catalogs. The Ubuntu runner has python3 pre-installed but
        # not the pdfplumber package, so install on demand for nc entries.
        if: matrix.state == 'nc'
        run: pip install --quiet pdfplumber

      - name: Install poppler-utils (AZ/AR/WV scrapers shell out to pdftotext)
        # scripts/az/scrape-dine.ts — Diné College PDF schedule
        # scripts/ar/scrape-uaccm.ts — UACCM PDF schedule
        # scripts/ar/scrape-seark-pdf-programs.ts — SEARK PDF catalog
        # scripts/wv/scrape-eastern-wv.ts — Eastern WV PDF schedule
        # The Ubuntu runner doesn't ship poppler-utils by default.
        if: matrix.state == 'az' || matrix.state == 'ar' || matrix.state == 'wv'
        run: sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Resolve terms
        id: terms
        if: matrix.termSystem != ''
        run: |
          resolved=$(npx tsx scripts/lib/resolve-terms.ts --system "${{ matrix.termSystem }}")
          # Extract comma-separated human-readable term names for --term flag
          term_arg=$(echo "$resolved" | jq -r '.terms | join(",")')
          echo "term_arg=$term_arg" >> "$GITHUB_OUTPUT"
          echo "Resolved terms for ${{ matrix.termSystem }}: $term_arg" >&2

      - name: Run scraper scripts
        env:
          # Scrapers have an inline Supabase-import fallback when env is set;
          # deliberately pass --no-import and omit the service key so nothing
          # can write to prod from this workflow. See #59 design doc.
          SUPABASE_SERVICE_ROLE_KEY: ""
        run: |
          # Per-script isolation: one bad script must not abort the rest of
          # the leg. Without this, the first non-zero exit (one college's
          # source 404'd, one Banner connect-timed-out) takes every later
          # script in the same matrix entry offline — see issues #159, #160,
          # #161 and the May 2026 scheduled-scrape failures where one bad
          # PDF download killed seven NC college scrapes.
          #
          # We capture each script's exit code, log it, and continue. The
          # step fails (exit 1) only if every script in the leg failed,
          # preserving the red-x signal for genuine outages while letting
          # partial successes ship their data through the rest of the
          # workflow (upload, diff, commit).
          term_arg="${{ steps.terms.outputs.term_arg }}"
          succeeded=0
          failed_scripts=()
          while IFS= read -r script; do
            [ -z "$script" ] && continue
            echo "::group::$script"
            rc=0
            if [ -n "$term_arg" ]; then
              npx tsx "$script" --no-import --term "$term_arg" || rc=$?
            else
              npx tsx "$script" --no-import || rc=$?
            fi
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              succeeded=$((succeeded + 1))
            else
              echo "::warning title=Scraper script failed::$script exited with code $rc"
              failed_scripts+=("$script")
            fi
          done <<< "${{ matrix.scripts }}"

          echo ""
          echo "Leg summary: ${succeeded} script(s) succeeded, ${#failed_scripts[@]} failed"
          if [ ${#failed_scripts[@]} -gt 0 ]; then
            printf '  failed: %s\n' "${failed_scripts[@]}"
          fi
          # Red the step only when nothing worked. Partial success is
          # still a success — the data that did get scraped should ship.
          if [ "$succeeded" -eq 0 ]; then
            echo "::error::All scripts in this leg failed"
            exit 1
          fi

      - name: Upload scraped data
        # Run even when the scrape step failed so any diagnostic dumps the
        # script wrote (e.g. data/va/ps-discovery/drift-*.html for issue #98)
        # reach the workflow run page. By default GitHub skips remaining
        # steps after a failure unless `if: always()` is set.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-${{ matrix.id }}
          path: data/${{ matrix.state }}
          retention-days: 7
          if-no-files-found: ignore

  # ----------------------------------------------------------------------
  # Per-state aggregate (issue #169). Each state opens its own PR so a
  # 30-min NJ scrape doesn't wait on a 2-hr VA PeopleSoft run before its
  # data can land. Each runner only handles its own state's artifacts and
  # diffs `data/{state}/` against main — no cross-state coupling.
  # ----------------------------------------------------------------------
  aggregate:
    needs: [plan, scrape]
    if: always() && needs.plan.outputs.empty == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        state: ${{ fromJSON(needs.plan.outputs.states).states }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      - name: Download this state's scrape artifacts
        uses: actions/download-artifact@v4
        with:
          # Matches scrape-{state}-{datatype}-{idx} (e.g. scrape-nj-courses-0).
          # Aggregate-from-courses prereqs states have no artifacts; the
          # download step is a no-op for them and we proceed to re-aggregate
          # off committed course data below.
          pattern: scrape-${{ matrix.state }}-*
          path: /tmp/scrape-artifacts

      - name: Overlay artifacts into working tree
        run: |
          shopt -s nullglob
          for dir in /tmp/scrape-artifacts/scrape-${{ matrix.state }}-*; do
            mkdir -p "data/${{ matrix.state }}"
            cp -R "$dir"/. "data/${{ matrix.state }}/"
          done
          git status --short | head -40

      - name: Aggregate prereqs from course data (this state)
        # Issue #144: aggregate-from-courses states declare prereqs in
        # StateConfig but have no scrape job. Refresh prereqs.json off
        # data/{state}/courses/** (committed on main + overlay above).
        if: needs.plan.outputs.datatype == 'prereqs'
        run: npx tsx scripts/lib/aggregate-prereqs.ts ${{ matrix.state }}

      - name: Diff against main (this state only)
        id: diff
        run: |
          json=$(npx tsx scripts/lib/scrape-diff.ts --path data/${{ matrix.state }} --format json)
          md=$(npx tsx scripts/lib/scrape-diff.ts --path data/${{ matrix.state }} --format markdown)
          {
            echo "report_json<<EOF"
            echo "$json"
            echo "EOF"
            echo "report_md<<EOF"
            echo "$md"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "broken=$(echo "$json" | jq -r '.broken')" >> "$GITHUB_OUTPUT"
          echo "changed=$(echo "$json" | jq -r '.changed')" >> "$GITHUB_OUTPUT"
          echo "$md"

      - name: Open issue on regression
        if: steps.diff.outputs.broken == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_MD: ${{ steps.diff.outputs.report_md }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DT: ${{ needs.plan.outputs.datatype }}
          ST: ${{ matrix.state }}
        run: |
          today=$(date -u +"%Y-%m-%d")
          {
            echo "Scheduled **${DT}** scrape for **${ST}** on ${today} produced one or more files that dropped below 50% of their prior row count. Scraper is likely broken (expired cookie, source-site change, parser regression)."
            echo
            printf '%s\n' "$REPORT_MD"
            echo
            echo "**No PR was opened.** Investigate the ${ST} scraper(s) before re-running."
            echo
            echo "Workflow run: ${RUN_URL}"
          } > issue-body.md
          gh issue create \
            --title "Scheduled ${DT} scrape: ${ST} regression (${today})" \
            --body-file issue-body.md

      - name: Open PR with fresh data
        if: steps.diff.outputs.broken == 'false' && steps.diff.outputs.changed != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: scheduled-scrape/${{ matrix.state }}-${{ needs.plan.outputs.datatype }}
          commit-message: "Scheduled ${{ needs.plan.outputs.datatype }} scrape: ${{ matrix.state }} — ${{ steps.diff.outputs.changed }} file(s)"
          title: "Scheduled ${{ needs.plan.outputs.datatype }} scrape: ${{ matrix.state }} — ${{ steps.diff.outputs.changed }} file(s) updated"
          body: |
            Automated output of the unified scheduled-scrape workflow (issues #59, #169).

            State: **${{ matrix.state }}** · datatype: **${{ needs.plan.outputs.datatype }}**

            ${{ steps.diff.outputs.report_md }}

            **Do not auto-merge.** Skim the diff before landing. Schema validation (#49) and change detection (#51) both run again at import time once this lands on main.
          labels: scraper-output,automated
          delete-branch: true

      - name: No-op summary
        if: steps.diff.outputs.broken == 'false' && steps.diff.outputs.changed == '0'
        run: echo "No changes for ${{ matrix.state }} — nothing to PR."

  # ----------------------------------------------------------------------
  # Health monitor (issue #120) — runs once after all per-state aggregates.
  # Classifies every (state × declared scraper) pair as healthy/empty/failed
  # and keeps a rolling issue per datatype so silence is never the answer.
  # Needs all artifacts (and a full prereqs aggregation) to classify
  # accurately — this is the one place a single-runner view is correct.
  # ----------------------------------------------------------------------
  health:
    needs: [plan, scrape, aggregate]
    if: always() && needs.plan.outputs.empty == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      - name: Download all scrape artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: scrape-*
          path: /tmp/scrape-artifacts

      - name: Overlay artifacts into working tree
        run: |
          shopt -s nullglob
          for dir in /tmp/scrape-artifacts/scrape-*; do
            base=$(basename "$dir")
            state=$(echo "$base" | sed -E 's/^scrape-([a-z]+)-.*/\1/')
            mkdir -p "data/$state"
            cp -R "$dir"/. "data/$state/"
          done

      - name: Aggregate prereqs from course data (all states)
        if: needs.plan.outputs.datatype == 'prereqs'
        run: npx tsx scripts/lib/aggregate-prereqs.ts --all

      - name: Run health check
        id: health
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --history-out writes only NEW records to a temp delta file; the
          # next step concatenates it onto data/state-health/history.jsonl
          # (in main) and pushes. Writing to a delta file rather than the
          # working-tree file lets us rebase-and-retry safely on push race.
          npx tsx scripts/lib/check-scrape-health.ts \
            --datatype "${{ needs.plan.outputs.datatype }}" \
            --run-id "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --data-dir data \
            --status-out /tmp/health.json \
            --history-out /tmp/history-delta.jsonl
          echo "all_healthy=$(jq -r '.allHealthy' /tmp/health.json)" >> "$GITHUB_OUTPUT"
          # Persist markdown body via env to avoid GITHUB_OUTPUT multiline quoting issues.
          {
            echo 'body<<HEALTH_BODY_EOF'
            jq -r '.markdown' /tmp/health.json
            echo 'HEALTH_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Append history delta to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DT: ${{ needs.plan.outputs.datatype }}
        run: |
          set -e
          if [ ! -s /tmp/history-delta.jsonl ]; then
            echo "No delta records to persist (file missing or empty); skipping."
            exit 0
          fi
          delta_count=$(wc -l < /tmp/history-delta.jsonl)

          git config user.name "state-health-bot"
          git config user.email "state-health-bot@users.noreply.github.com"

          # Append-only file: pull-rebase-retry handles concurrent cron writes.
          # In practice the four datatypes' cron schedules don't overlap by
          # more than a few hours, but a retry loop is cheap insurance.
          attempt=0
          max_attempts=5
          until [ $attempt -ge $max_attempts ]; do
            attempt=$((attempt + 1))
            git pull --rebase --autostash origin main || true
            mkdir -p data/state-health
            cat /tmp/history-delta.jsonl >> data/state-health/history.jsonl
            git add data/state-health/history.jsonl
            git commit -m "chore(state-health): append ${delta_count} ${DT} records from run ${{ github.run_id }}" \
              -m "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              || { echo "Nothing to commit"; exit 0; }
            if git push origin main; then
              echo "Pushed history append on attempt ${attempt}."
              exit 0
            fi
            echo "Push failed on attempt ${attempt} (likely concurrent push). Rolling back local commit and retrying."
            git reset --hard HEAD~1
            sleep $((attempt * 5))
          done
          echo "Failed to push history append after ${max_attempts} attempts." >&2
          exit 1

      - name: Update rolling health issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DT: ${{ needs.plan.outputs.datatype }}
          BODY: ${{ steps.health.outputs.body }}
          ALL_HEALTHY: ${{ steps.health.outputs.all_healthy }}
        run: |
          set -e
          title="Scraper health — ${DT}"
          # Find existing issue (open or closed) by exact title match.
          existing=$(gh issue list \
            --search "in:title \"${title}\"" \
            --state all \
            --limit 5 \
            --json number,state,title \
            --jq ".[] | select(.title == \"${title}\") | .number" \
            | head -n 1)

          printf '%s\n' "$BODY" > /tmp/issue-body.md

          if [ -z "$existing" ]; then
            if [ "$ALL_HEALTHY" = "true" ]; then
              echo "First run for '${title}', all healthy — not opening an issue."
              exit 0
            fi
            gh issue create \
              --title "${title}" \
              --body-file /tmp/issue-body.md \
              --label "scraper-health,automated"
            exit 0
          fi

          gh issue edit "$existing" --body-file /tmp/issue-body.md

          state=$(gh issue view "$existing" --json state --jq .state)
          if [ "$ALL_HEALTHY" = "true" ] && [ "$state" = "OPEN" ]; then
            gh issue close "$existing" --comment "All declared ${DT} scrapers healthy on the latest tick. Closing — will reopen automatically if a future tick regresses."
          elif [ "$ALL_HEALTHY" = "false" ] && [ "$state" = "CLOSED" ]; then
            gh issue reopen "$existing" --comment "Reopening — at least one ${DT} scraper is failing or producing empty output."
          fi

      - name: Run triage classifier
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx tsx scripts/lib/triage-scraper-health.ts \
            --history data/state-health/history.jsonl \
            --window-days 14 \
            --out /tmp/triage.json 2>&1

          actionable=$(jq '[.results[] | select(.classification == "persistent-broken" or .classification == "regression" or .classification == "partial-coverage-degraded")] | length' /tmp/triage.json)
          if [ "$actionable" -eq 0 ]; then
            echo "No actionable triage findings."
            exit 0
          fi

          title="Scraper triage — actionable findings"
          existing=$(gh issue list \
            --search "in:title \"${title}\"" \
            --state all \
            --limit 5 \
            --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" \
            | head -n 1)

          jq -r '.markdown' /tmp/triage.json > /tmp/triage-body.md

          if [ -z "$existing" ]; then
            issue_url=$(gh issue create \
              --title "${title}" \
              --body-file /tmp/triage-body.md \
              --label "scraper-health,automated,triage")
          else
            gh issue edit "$existing" --body-file /tmp/triage-body.md
            issue_state=$(gh issue view "$existing" --json state --jq .state)
            if [ "$issue_state" = "CLOSED" ]; then
              gh issue reopen "$existing" --comment "Reopening — triage found ${actionable} actionable finding(s)."
            fi
            issue_url="https://github.com/${{ github.repository }}/issues/${existing}"
          fi
          echo "issue_url=${issue_url}" >> "$GITHUB_OUTPUT"
          echo "actionable=${actionable}" >> "$GITHUB_OUTPUT"
        id: triage

      - name: Email triage alert
        if: steps.triage.outputs.actionable != '' && steps.triage.outputs.actionable != '0'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          actionable="${{ steps.triage.outputs.actionable }}"
          issue_url="${{ steps.triage.outputs.issue_url }}"

          broken=$(jq '[.results[] | select(.classification == "persistent-broken")] | length' /tmp/triage.json)
          regressions=$(jq '[.results[] | select(.classification == "regression")] | length' /tmp/triage.json)
          partial=$(jq '[.results[] | select(.classification == "partial-coverage-degraded")] | length' /tmp/triage.json)

          # Build a plain-text summary of what's broken
          summary=$(jq -r '
            [.results[] | select(.classification == "persistent-broken" or .classification == "regression" or .classification == "partial-coverage-degraded")]
            | map("• \(.state | ascii_upcase)/\(.datatype) job \(.job_index): \(.classification) — \(.key_signals | join("; "))")
            | join("\n")
          ' /tmp/triage.json)

          subject="⚠️ Scraper triage: ${actionable} finding(s) need attention"

          text="Scraper Health Triage Alert

          ${actionable} actionable finding(s) from the latest cron run:
          - Persistent-broken: ${broken}
          - Regressions: ${regressions}
          - Partial-coverage: ${partial}

          ${summary}

          View full triage: ${issue_url}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          html="<div style=\"font-family: -apple-system, sans-serif; max-width: 560px; margin: 0 auto; padding: 24px;\">
          <h2 style=\"color: #0d9488;\">Scraper Health Triage</h2>
          <p><strong>${actionable}</strong> actionable finding(s) from the latest cron run:</p>
          <ul>
            <li>🔴 Persistent-broken: <strong>${broken}</strong></li>
            <li>🟡 Regressions: <strong>${regressions}</strong></li>
            <li>🟠 Partial-coverage: <strong>${partial}</strong></li>
          </ul>
          <pre style=\"background: #f4f4f5; padding: 12px; border-radius: 6px; font-size: 13px; overflow-x: auto;\">${summary}</pre>
          <p><a href=\"${issue_url}\" style=\"color: #0d9488;\">View full triage →</a></p>
          <hr style=\"border: none; border-top: 1px solid #eee;\">
          <p style=\"font-size: 11px; color: #aaa;\">Community College Path · automated alert</p>
          </div>"

          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg from "Community College Path <notifications@communitycollegepath.com>" \
              --arg to "rohanuplekar@gmail.com" \
              --arg subject "$subject" \
              --arg html "$html" \
              --arg text "$text" \
              '{from: $from, to: $to, subject: $subject, html: $html, text: $text}'
            )"
